  --panel2:#050905;
  --border:#173817;
  --text:#b7ffb7;
  --muted:#5f9b5f;
  --accent:#20e020;
  --accent2:#13b913;
  --danger:#ef4444;
  --ok:#20e020;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#030603;
  color:#b7ffb7;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:22px;
}

header{
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:23px;
  color:#45ff45;
  letter-spacing:1px;
  text-shadow:0 0 8px rgba(32,224,32,.28);
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:#081008;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
}

.player{
  background:#000;
  border-radius:11px;
  overflow:hidden;
  aspect-ratio:16/9;
}

video{
  display:block;
  width:100%;
  height:100%;
  background:#000;
}

.status{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  background:var(--panel2);
  color:var(--muted);
  font-size:13px;
}

.status.ok{color:#86efac}
.status.error{color:#fca5a5}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

/* ===== RESPONSIVE + iOS SAFARI ===== */
html, body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

select,
input{
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  width:100%;
  height:40px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  background:#050905;
  color:var(--text);
  font-size:16px;        /* giữ 16px để Safari iPhone không tự zoom */
}

#manualChannelInput{
  height:40px;
}

#urlBox{
  height:40px;
}

#templateSelect,
#channelSelect{
  height:40px;
}

#vidCurrent{
  height:40px;
  padding:6px;
}

select:focus,
input:focus{
  border-color:var(--accent);
}

#vidCurrent{
  width:90px;
  height:40px;
  padding:6px;
  text-align:center;
  font-weight:700;
  font-family:Consolas,monospace;
}

.url-row{
  display:flex;
  gap:8px;
}

.url-row input{
  font-family:Consolas,monospace;
  font-size:14px;        /* vẫn giữ 14px nhưng không bị zoom vì đã có 16px chung */
  flex:1 1 260px;
  min-width:0;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
/* Ô nhập kênh thủ công */
.manual-channel-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}
.manual-channel-row input{
  flex:1 1 360px;
  min-width:0;
}
.manual-channel-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}
.manual-channel-actions button{
  white-space:nowrap;
}

.channel-actions{
  margin-top:8px;
}

.channel-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.channel-row select{
  flex:1 1 360px;
  min-width:260px;
  width:100%;
}

.channel-nav{
  position:relative;
  z-index:30;
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  flex-wrap:nowrap;
  white-space:nowrap;
}

.channel-nav button{
  position:relative;
  z-index:31;
  pointer-events:auto;
  white-space:nowrap;
}

<div class="app">

<header>
  <h1>⌨ M3U8 // STREAM SCANNING</h1>
  </header>

<!-- PLAYER -->
<div class="card">
  <div class="player">
    <video id="video" controls playsinline></video>
  </div>

  <div id="status" class="status">
    ⚪ Chưa phát stream
  </div>


</div>

<!-- CHỌN KÊNH / LINK -->
<div class="card scan-panel" id="channelPanel">
    <div class="panel-head">
    <label>▸ DÒ KÊNH THỦ CÔNG</label>
       <button class="secondary panel-toggle" type="button"
            onclick="togglePanel('channelBody','channelToggle')" aria-expanded="true"
            aria-label="Toggle channel panel">
      <span id="channelToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="channelBody">
    <div class="grid">
      <div>
                <div class="manual-channel-row">
          <input id="manualChannelInput" type="text"
                 placeholder="Ví dụ: vtv1" autocomplete="off"
                 aria-label="Nhập tên kênh thủ công">
          <div class="manual-channel-actions">
            <button class="secondary" onclick="useManualChannel()" aria-label="Dùng kênh thủ công">DÙNG KÊNH</button>
            <button class="danger" onclick="clearManualChannel()" aria-label="Xóa kênh thủ công">XÓA KÊNH</button>
          </div>
        </div>

        <div class="counter">
          Kênh nhập thủ công chỉ dùng trong lần này — không lưu lại sau khi F5.
        </div>



        <label style="margin-top:12px">▸ CHỌN LIST KÊNH</label>
        <div class="channel-row">
          <select id="channelSelect" aria-label="Chọn kênh"></select>
          <div class="channel-nav">
            <button id="prevChannelBtn" class="secondary" type="button" aria-label="Kênh trước">⬅ KÊNH TRƯỚC</button>
            <button id="nextChannelBtn" class="secondary" type="button" aria-label="Kênh sau">KÊNH SAU ➡</button>
            <button id="autoScanBtn" class="danger" type="button" aria-label="Dò tự động">⚡ DÒ TỰ ĐỘNG</button>
            <button id="resetAutoScanBtn" class="secondary" type="button" aria-label="Dò lại từ đầu">↻ DÒ LẠI TỪ ĐẦU</button>
          </div>
        </div>
        <div id="channelCounter" class="counter"></div>
      </div>

      <div>
        <label>▸ STREAM SOURCE</label>
        <select id="templateSelect" aria-label="Chọn link stream"></select>
        <div id="linkCounter" class="counter"></div>
      </div>

    </div>
  </div>
</div>

<!-- DÒ KÊNH FREEM3U -->
<div class="card scan-panel" id="vidScanPanel">
  <div class="panel-head">
    <label>▸ FREEM3U // DÒ KÊNH THEO SỐ</label>
    <button class="secondary panel-toggle" type="button"
            onclick="togglePanel('vidScanBody','vidScanToggle')"
            aria-expanded="true"
            aria-label="Toggle FreeM3U panel">
      <span id="vidScanToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="vidScanBody">
    <div class="vid-scan-control">
      <div class="vid-scan-number">
        <label>SỐ ĐANG DÒ</label>
        <input id="vidCurrent" value="1" readonly aria-label="Số kênh đang dò">
      </div>

      <div class="vid-scan-nav">
        <button id="vidScanBtn" class="danger" onclick="startVidScan()" aria-label="Dò tới">🔎 DÒ TỚI</button>
        <button class="secondary" onclick="scanBackward()" aria-label="Dò lùi">◀️ DÒ LÙI</button>
      </div>

      <div class="vid-scan-actions">
        <button class="secondary" onclick="resetVidScan()" aria-label="Dò lại từ đầu FreeM3U">↺ DÒ LẠI TỪ ĐẦU</button>
      </div>
    </div>

    <div id="vidScanStatus" class="counter">
      ⚪ Sẵn sàng
    </div>
  </div>
</div>

<!-- URL -->
<div class="card">
  <label>▸ STREAM URL RESULT</label>

  <div class="url-row">
    <input id="urlBox" readonly aria-label="Stream URL">
    <button onclick="copyUrl()" aria-label="Copy URL">COPY</button>
  </div>

  <div id="qualityBox" class="quality-box">
    📺 CHẤT LƯỢNG: <span id="qualityText">Chưa dò kênh</span>
  </div>
</div>

</div>

/*
   iOS/Safari BUTTON HANDLERS
   Không dùng inline onclick.
   click là event chuẩn; touchend chỉ fallback cho iOS cũ.
*/
function bindIOSButton(button, handler) {
  if (!button) return;

  let lastTouch = 0;

  button.addEventListener("touchend", function(event) {
    lastTouch = Date.now();
    event.preventDefault();
    event.stopPropagation();
    handler();
  }, {passive:false});

  button.addEventListener("click", function(event) {
    if (Date.now() - lastTouch < 800) return;
    event.preventDefault();
    event.stopPropagation();
    handler();
  }, false);
}

function isIOS() {

         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

/* =========================================================
   PHÁT URL
   iOS/iPadOS: ưu tiên HLS native của Safari.
   PC/Android: dùng hls.js khi có MSE.
========================================================= */

function setupHlsPlayback(url, {
  onPlaying,
  onError,
  timeout = 10000
} = {}) {
  let finished = false;
  let timer = null;
  let nativeCleanup = null;

  const cleanup = () => {
    clearTimeout(timer);
    if (nativeCleanup) {
      nativeCleanup();
      nativeCleanup = null;
    }
    if (onPlaying) {
      video.removeEventListener("playing", onVideoPlaying);
    }
    if (onError) {
      video.removeEventListener("error", onVideoError);
    }
    if (hls && window.Hls) {
      hls.off(Hls.Events.MANIFEST_PARSED, onManifestParsed);
      hls.off(Hls.Events.ERROR, onHlsError);
    }
  };

  const finish = (success) => {
    if (finished) return;
    finished = true;
    cleanup();

    if (success) {
      if (onPlaying) onPlaying();
    } else if (onError) {
      onError();
    }
  };

  const onManifestParsed = () => {
    video.play().catch(() => {});
  };

  const onHlsError = (event, data) => {
    if (data && data.fatal) {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      finish(false);
    }
  };

  const onVideoPlaying = () => finish(true);
  const onVideoError = () => finish(false);

  if (onPlaying) {
    video.addEventListener("playing", onVideoPlaying, {once:true});
  }
  if (onError) {
    video.addEventListener("error", onVideoError, {once:true});
  }

  // iOS/iPadOS: native HLS trước.
  if (
    isIOS() &&
    video.canPlayType("application/vnd.apple.mpegurl")
  ) {
    const onMetadata = () => {
      if (nativeCleanup) nativeCleanup();
      video.play().catch(() => {});
    };
    const onErrorNative = () => {
      if (nativeCleanup) nativeCleanup();
      finish(false);
    };
    
    nativeCleanup = () => {
      video.removeEventListener("loadedmetadata", onMetadata);
      video.removeEventListener("error", onErrorNative);
    };
    
    video.addEventListener("loadedmetadata", onMetadata, {once:true});
    video.addEventListener("error", onErrorNative, {once:true});
    video.src = url;
  }
  // PC/Android/macOS: hls.js khi MSE được hỗ trợ.
  else if (window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:30
    });

    hls.on(Hls.Events.MANIFEST_PARSED, onManifestParsed);
    hls.on(Hls.Events.ERROR, onHlsError);

    hls.loadSource(url);
    hls.attachMedia(video);
  }
  // Native HLS fallback.
  else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    const onMetadata = () => {
      if (nativeCleanup) nativeCleanup();
      video.play().catch(() => {});
    };
    const onErrorNative = () => {
      if (nativeCleanup) nativeCleanup();
      finish(false);
    };
    
    nativeCleanup = () => {
      video.removeEventListener("loadedmetadata", onMetadata);
      video.removeEventListener("error", onErrorNative);
    };
    
    video.addEventListener("loadedmetadata", onMetadata, {once:true});
    video.addEventListener("error", onErrorNative, {once:true});
    video.src = url;
  }
  else {
    finish(false);
    return;
  }

  timer = setTimeout(() => finish(false), timeout);

  return {
    cancel: () => finish(false)
  };
}

function playUrl(url,index) {
  // Phát thủ công: bật tiếng bình thường.
  video.muted = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  destroyPlayer();

  currentPlayingLink = index;

  setStatus(
    "⏳ Đang kết nối Link " +
    (index + 1) +
    "..."
  );

  const cancel = setupHlsPlayback(url, {
    onPlaying: () => {
      setStatus(
        "🟢 Đang phát — Link " +
        (index + 1),
        "ok"
      );
    },
    onError: () => {
      setStatus(
        "🔴 Không phát được Link " +
        (index + 1),
        "error"
      );
    }
  });
  // Lưu để có thể hủy khi cần
  activePlaybackCancel = cancel ? cancel.cancel : null;
}

   DÒ LINK TỰ ĐỘNG
   - Luôn dò từ Link 1 → Link cuối
   - Mỗi link chỉ thử đúng 1 lần
   - Link nào phát được thì dừng ngay

function setAutoScanButton(scanning) {
  const btn = document.getElementById("autoScanBtn");
  if(!btn) return;

  btn.disabled = !!scanning;
  btn.textContent = scanning
    ? "⏳ ĐANG DÒ..."
    : "⚡ DÒ TỰ ĐỘNG";
}

function tryAutoScanLink(index, token) {
  return new Promise((resolve) => {
    if(token !== autoScanToken) { resolve(false); return; }

    const url = getUrl(index);
    currentPlayingLink = index;
    templateSelect.selectedIndex = index;
    urlBox.value = url;

    setStatus("🔎 Đang kiểm tra " + getActiveChannelCode() + " — Link " + (index + 1) + "/" + templates.length + "...");

    let done = false;
    let timer = null;
    let probeHls = null;
    let nativeCleanup = null;
    let cancelFn = null;

    const finish = (ok) => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      if(probeHls) {
        const probe = probeHls;
        probeHls = null;
        if (activeProbeHls === probe) activeProbeHls = null;
        try { probe.destroy(); } catch(e) {}
      }
      if(nativeCleanup) {
        nativeCleanup();
        nativeCleanup = null;
      }
      if (cancelFn) {
        cancelFn();
        cancelFn = null;
      }
      resolve(ok);
    };

    timer = setTimeout(() => finish(false), 10000);

    // Dùng một Hls instance riêng để kiểm tra manifest.
    if(window.Hls && Hls.isSupported()) {
      try {
        probeHls = new Hls({ enableWorker:true, lowLatencyMode:true, backBufferLength:30 });
        activeProbeHls = probeHls; // lưu để hủy khi cần
        probeHls.once(Hls.Events.MANIFEST_PARSED, () => finish(true));
        probeHls.once(Hls.Events.ERROR, (event, data) => {
          if(data && data.fatal) {
            if(probeHls) {
              probeHls.destroy();
              probeHls = null;
              if (activeProbeHls === probeHls) activeProbeHls = null;
            }
            finish(false);
          }
        });
        probeHls.attachMedia(video);
        probeHls.loadSource(url);
        // Lưu cancel function (không cần thiết vì đã có probeHls.destroy)
      } catch(e) {
        console.error("Probe HLS:", e);
        if(probeHls) {
          probeHls.destroy();
          probeHls = null;
          if (activeProbeHls === probeHls) activeProbeHls = null;
        }
        finish(false);
      }
      return;
    }

    // Safari/iOS: dùng native HLS.
    if(video.canPlayType("application/vnd.apple.mpegurl")) {
      const onMetadata = () => { 
        if(nativeCleanup) nativeCleanup();
        finish(true); 
      };
      const onError = () => { 
        if(nativeCleanup) nativeCleanup();
        finish(false); 
      };
      nativeCleanup = () => {
        video.removeEventListener("loadedmetadata", onMetadata);
        video.removeEventListener("error", onError);
      };
      video.addEventListener("loadedmetadata", onMetadata, {once:true});
      video.addEventListener("error", onError, {once:true});
      video.src = url;
      return;
    }

    finish(false);
  });
}

function autoScanLinks() {
  if(autoScanning) {
    setStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  const input = document.getElementById("manualChannelInput");
  const typedCode = input ? input.value.trim() : "";

  // Nếu có chữ trong ô nhập tay, LUÔN ưu tiên ô này (nhưng chỉ khi bấm dò)
  if(typedCode) {
    if(typedCode !== manualChannelCode.trim()) {
      manualChannelCode = typedCode;
      autoScanNextIndex = 0;
      autoScanToken++;
    } else {
      manualChannelCode = typedCode;
    }
  }

  const code = getActiveChannelCode().trim();
  if(!code) {
    setStatus("⚠️ Chưa có mã kênh để dò", "error");
    return;
  }

  if(autoScanNextIndex >= templates.length) {
    setStatus("⚪ " + code + " đã dò hết " + templates.length + " link — bấm DÒ LẠI TỪ ĐẦU", "error");
    return;
  }

  // Dừng FreeM3U nhưng giữ nguyên manualChannelCode.
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  setVidScanButton(false);

  // Hủy dò đang chạy
  cancelActiveProbe();

  autoScanning = true;
  autoScanToken++;
  const token = autoScanToken;
  let index = autoScanNextIndex;
  setAutoScanButton(true);

  const scanNext = () => {
    if(token !== autoScanToken || !autoScanning) return;

    if(index >= templates.length) {
      autoScanNextIndex = templates.length;
      autoScanning = false;
      setAutoScanButton(false);
      setStatus("🔴 " + code + " — đã dò hết " + templates.length + " link, không tìm thấy link hợp lệ", "error");
      return;
    }

    const testIndex = index++;
    autoScanNextIndex = index;

    tryAutoScanLink(testIndex, token).then(success => {
      if(token !== autoScanToken || !autoScanning) return;

      if(success) {
        autoScanning = false;
        setAutoScanButton(false);
        templateSelect.selectedIndex = testIndex;
        updateUrl();
        showQuality(testIndex, true);
        playUrl(getUrl(testIndex), testIndex);
        setStatus("🟢 Tìm thấy " + code + " — Link " + (testIndex + 1) + " hợp lệ và đang phát", "ok");
        return;
      }

      const timer = setTimeout(scanNext, 30);
      autoScanTimers.push(timer);
    }).catch(err => {
      console.error("Auto scan:", err);
      if(token === autoScanToken && autoScanning) {
        const timer = setTimeout(scanNext, 30);
        autoScanTimers.push(timer);
      }
    });
  };

  templateSelect.selectedIndex = 0;
  updateUrl();
  setStatus("🔎 Bắt đầu dò kênh " + code + " từ Link 1...");
  setTimeout(scanNext, 0);
}

function updateVidScanDisplay(number) {
  vidScanNumber = number;
  if(vidCurrent) vidCurrent.value = number;
}

function setVidScanStatus(text, type="") {
  if(!vidScanStatus) return;

  vidScanStatus.textContent = text;
  vidScanStatus.style.color =
    type === "ok" ? "#86efac" :
    type === "error" ? "#fca5a5" :
    "";
}

function tryVidNumber(number, token) {
  return new Promise((resolve) => {
    if (token !== vidScanToken || !vidScanning) {
      resolve(false);
      return;
    }

    const url = getVidUrl(number);

    destroyPlayer();

    const cancelFn = setupHlsPlayback(url, {
      timeout: VID_SCAN_TIMEOUT,
      onPlaying: () => resolve(true),
      onError: () => resolve(false)
    });
    // Lưu cancel function
    if (cancelFn) {
      activePlaybackCancel = cancelFn.cancel;
    } else {
      activePlaybackCancel = null;
    }
  });
}

function startVidScan() {
  if(vidScanning) {
    setVidScanStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  if(vidScanNumber > VID_SCAN_MAX) {
    setVidScanStatus(
      "🟢 Đã dò hết số 1 → " + VID_SCAN_MAX +
      (vidFoundNumbers.length
        ? " | Tìm thấy: " + vidFoundNumbers.join(", ")
        : " | Không tìm thấy kênh.")
    );
    return;
  }

  // Nếu bắt đầu từ số 1 thì đây là một lượt dò mới.
  if(vidScanNumber === 1) {
    vidFoundNumbers = [];
  }

  vidScanning = true;
  vidScanToken++;
  // Hủy dò cũ
  cancelActiveProbe();

  const token = vidScanToken;
  setVidScanButton(true);

  function scanNext() {
    if(token !== vidScanToken || !vidScanning) return;

    if(vidScanNumber > VID_SCAN_MAX) {
      vidScanning = false;
      setVidScanButton(false);
      setVidScanStatus(
        vidFoundNumbers.length
          ? "🟢 Đã dò hết 1 → " + VID_SCAN_MAX +
            " | Tìm thấy: " + vidFoundNumbers.join(", ")
          : "🔴 Đã dò hết số 1 → " + VID_SCAN_MAX + " mà chưa tìm thấy kênh.",
        vidFoundNumbers.length ? "ok" : "error"
      );
      return;
    }

    const number = vidScanNumber;
    updateVidScanDisplay(number);

    setVidScanStatus(
      "🔎 Đang dò kênh số " + number + "/" + VID_SCAN_MAX + "..."
    );

    tryVidNumber(number, token).then((success) => {
      if(token !== vidScanToken || !vidScanning) return;

      if(success) {
        // Tìm thấy tín hiệu: dừng NGAY tại số này để người dùng xem.
        vidFoundNumbers.push(number);
        updateVidScanDisplay(number);

        urlBox.value = getVidUrl(number);
        freem3uPlaying = true;
        freem3uPlayingNumber = number;

        // Đã tìm thấy: dừng lượt hiện tại nhưng nhớ số kế tiếp.
        // Lần bấm DÒ SỐ TỰ ĐỘNG tiếp theo sẽ dò từ số này.
        vidScanNumber = number + 1;
        vidScanning = false;
        if(vidScanBtn) vidScanBtn.disabled = false;

        setVidScanStatus(
          "🎯 TÌM THẤY TÍN HIỆU Ở KÊNH #" + number +
          " — ĐÃ DỪNG. Bấm ĐANG DÒ KÊNH ... để dò tiếp từ #" +
          vidScanNumber + ".",
          "ok"
        );

        setStatus(
          "🟢 FREEM3U — Tìm thấy kênh " + number +
          " — đã dừng dò để bạn xem."
        );

        return;
      }

      // Không có -> tự tăng số và dò tiếp.
      vidScanNumber = number + 1;
      setTimeout(scanNext, 0);

    }).catch((error) => {
      console.log("FreeM3U scan:", error);

      if(token !== vidScanToken || !vidScanning) return;

      vidScanNumber = number + 1;
      setTimeout(scanNext, 0);
    });
  }

  setTimeout(scanNext, 0);
}

function scanBackward() {
  if(vidScanning) {
    setVidScanStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  // DÒ LÙI phải căn cứ đúng vào "SỐ ĐANG DÒ" đang hiển thị.
  const current = Number(
    vidCurrent ? vidCurrent.value : vidScanNumber
  );

  if(!Number.isFinite(current) || current < 1) {
    setVidScanStatus("⚪ Không xác định được số hiện tại để dò lùi.", "error");
    return;
  }

  const start = current - 1;

  if(start < 1) {
    setVidScanStatus("⚪ Đang ở số 1 — không còn số nhỏ hơn để dò lùi.");
    return;
  }

  vidScanNumber = start;
  startVidScan();
}

function stopVidScan() {
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  setVidScanButton(false);
  cancelActiveProbe();
  destroyPlayer();

  setVidScanStatus(
    "⚪ Đã dừng dò tại số " + vidScanNumber + ". Bấm DÒ SỐ TỰ ĐỘNG để tiếp tục."
  );
}

function resetVidScan() {
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  vidScanNumber = 1;
  vidFoundNumbers = [];
  cancelActiveProbe();
  destroyPlayer();

  setVidScanButton(false);
  updateVidScanDisplay(1);

  setVidScanStatus(
    "🔄 Đã reset — lần dò tiếp theo bắt đầu từ kênh số 1."
  );
}

/* =========================================================
   PHÁT LINK ĐANG CHỌN
========================================================= */

function playCurrent() {

  const index = Number(
    templateSelect.value
  );

  playUrl(
    getUrl(index),
    index
  );
}

function nextLink() {
  stopVidScan();
  cancelActiveProbe();

  let index = templateSelect.selectedIndex + 1;
  if(index >= templates.length) index = 0;

  resetAutoScanIndex();
  autoScanNextIndex = index;

  templateSelect.selectedIndex = index;
  updateUrl();
  playCurrent();
}

function prevLink() {
  stopVidScan();
  cancelActiveProbe();

  let index = templateSelect.selectedIndex - 1;
  if(index < 0) index = templates.length - 1;

  resetAutoScanIndex();
  autoScanNextIndex = index;

  templateSelect.selectedIndex = index;
  updateUrl();
  playCurrent();
}

/* =========================================================
   DỪNG
========================================================= */

function stopPlayer() {

  resetAutoScanIndex();
  stopVidScan();
  cancelActiveProbe();

  destroyPlayer();

  setStatus(
    "⚪ Đã dừng"
  );
}

/* =========================================================
   COPY URL
========================================================= */

async function copyUrl() {
  const url = urlBox.value;
  
  if (!url) {
    setStatus("⚠️ Không có URL để copy", "error");
    return;
  }

  try {
    await navigator.clipboard.writeText(url);
    setStatus("📋 Đã copy link", "ok");
  } catch(error) {
    // Fallback: select and copy
    try {
      urlBox.select();
      document.execCommand("copy");
      setStatus("📋 Đã copy link (fallback)", "ok");
    } catch(e) {
      setStatus("❌ Không thể copy link", "error");
    }
  }
}

/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "playing",
  function() {

    if(freem3uPlaying) {

      if(qualityText && freem3uPlayingNumber !== null) {
        qualityText.textContent =
          "FreeM3U — Kênh số " + freem3uPlayingNumber;
        qualityBox.classList.add('found');
      }

      setVidScanStatus(
        "🟢 TÌM THẤY KÊNH " + freem3uPlayingNumber + " — đang phát.",
        "ok"
      );

      setStatus(
        "🟢 FREEM3U — Kênh số " + freem3uPlayingNumber + " đang phát",
        "ok"
      );

      return;
    }

    showQuality(currentPlayingLink, true);

    setStatus(
      "🟢 Đang phát — Link " +
      (currentPlayingLink + 1),
      "ok"
    );
  }
);

video.addEventListener(
  "waiting",
  function() {

    setStatus(
      "⏳ Đang tải dữ liệu..."
    );
  }
);

video.addEventListener(
  "error",
  function() {

    setStatus(
      "🔴 Video không thể phát",
      "error"
    );
  }
);

/* =========================================================
   PHÍM TẮT
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    /*
      Không kích hoạt phím tắt khi đang nhập
    */

    if(
      event.target.tagName === "INPUT" ||
      event.target.tagName === "TEXTAREA"
    ) {
      return;
    }

    if(event.key === "ArrowRight") {
      event.preventDefault();
      nextLink();
    }

    else if(event.key === "ArrowLeft") {
      event.preventDefault();
      prevLink();
    }

    else if(event.key === "ArrowDown") {
      event.preventDefault();
      nextChannel();
    }

    else if(event.key === "ArrowUp") {
      event.preventDefault();
      prevChannel();
    }

    else if(event.key === "Enter") {
      event.preventDefault();
      playCurrent();
    }
  }
);


/* Kiểm tra nút sau khi toàn bộ DOM đã sẵn sàng */
if (!prevChannelBtn || !nextChannelBtn || !autoScanBtn || !resetAutoScanBtn) {
  console.error("M3U8 UI: Không tìm thấy đầy đủ các nút điều khiển.");
}

/* Khởi tạo panel ẨN/HIỆN */
document.getElementById("channelToggle")?.setAttribute("aria-expanded", "true");
document.getElementById("vidScanToggle")?.setAttribute("aria-expanded", "true");

/* Khởi tạo FREEM3U scanner */
updateVidScanDisplay(1);

/* Khởi tạo URL */
updateUrl();

</script>
