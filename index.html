<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Nhóm</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}

:root{
    --army:#4b5320;
    --army-dark:#384017;
    --army-deep:#2d3312;
    --army-input:#303614;
    --red:#d96b6b;
    --red-dark:#c65353;
    --red-light:#f08b8b;
    --text:#f4f4e8;
    --muted:#d9ddbd;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--army-dark);
    color:var(--text);
}

button,input{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#auth{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
    background:
        radial-gradient(circle at center,
        #596126 0%,
        var(--army-dark) 55%,
        var(--army-deep) 100%);
}

.card{
    width:min(390px,100%);
    background:var(--army);
    border:2px solid var(--red);
    border-radius:18px;
    padding:26px;
    box-shadow:0 10px 35px #0008;
}

.logo{text-align:center;font-size:42px}
.card h1{text-align:center;margin:8px 0;color:#fff}
.desc{text-align:center;color:#e3e5c8}

.tabs{
    display:flex;
    gap:4px;
    background:#343a16;
    border:1px solid #c95f5f;
    padding:4px;
    border-radius:9px;
    margin:20px 0 16px;
}

.tab{
    flex:1;
    border:1px solid transparent;
    background:transparent;
    color:#e1e4c8;
    padding:10px;
    border-radius:7px;
    font-weight:bold;
}

.tab:hover{border-color:var(--red);color:#fff}

.tab.active{
    background:var(--red);
    color:#fff;
    border-color:var(--red-light);
    box-shadow:0 2px 8px #0004;
}

.field{margin-bottom:12px}

.field label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
    color:#f0f1d9;
}

.field input{
    width:100%;
    padding:11px;
    background:var(--army-input);
    color:#fff;
    border:1px solid var(--red);
    border-radius:8px;
    outline:0;
}

.field input::placeholder{color:#aeb394}

.field input:focus{
    border-color:var(--red-light);
    box-shadow:0 0 0 2px #d96b6b33;
}

.primary{
    width:100%;
    padding:12px;
    border:1px solid var(--red-light);
    border-radius:8px;
    background:var(--red);
    color:#fff;
    font-weight:bold;
    transition:.15s;
}

.primary:hover{background:var(--red-dark);border-color:#ff9a9a}
.primary:active{transform:scale(.98)}
.primary:disabled{opacity:.5;cursor:not-allowed}

.msg{
    min-height:20px;
    text-align:center;
    font-size:13px;
    color:#ffb0b0;
    margin-top:10px;
}

.msg.ok{color:#b8e6a5}

/* APP */
#app{
    height:100vh;
    display:flex;
    background:var(--army-dark);
}

/* SIDEBAR */
.side{
    width:260px;
    background:var(--army);
    border-right:2px solid #c95f5f;
}

.brand{
    padding:18px;
    font-weight:bold;
    font-size:19px;
    color:#fff;
    border-bottom:1px solid #c95f5f;
}

.me{
    padding:12px;
    border-bottom:1px solid #c95f5f;
    display:flex;
    gap:10px;
    align-items:center;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--red);
    border:2px solid var(--red-light);
    display:grid;
    place-items:center;
    color:#fff;
    font-weight:bold;
}

.meinfo{flex:1;min-width:0}

.name{
    font-weight:bold;
    color:#fff;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.role{font-size:11px;color:var(--muted)}

.logout{
    border:1px solid var(--red);
    border-radius:7px;
    padding:8px;
    background:#343a16;
    color:#fff;
}

.logout:hover{background:var(--red)}

.room{
    margin:10px;
    padding:11px;
    border-radius:8px;
    background:#343a16;
    border:1px solid var(--red);
    color:#fff;
    font-weight:bold;
}

.room:hover{background:var(--red)}

/* CHAT */
.chat{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    background:var(--army-dark);
}

.head{
    height:60px;
    background:var(--army);
    border-bottom:2px solid #c95f5f;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:8px;
    color:#fff;
}

.live{
    font-size:11px;
    background:#343a16;
    color:#b8e6a5;
    border:1px solid var(--red);
    border-radius:15px;
    padding:5px;
}

.status{
    margin-left:auto;
    font-size:12px;
    color:var(--muted);
}

.messages{
    flex:1;
    overflow:auto;
    padding:18px;
    background:linear-gradient(135deg,var(--army-dark),#41491a);
}

.row{display:flex;margin-bottom:12px}
.mine{justify-content:flex-end}
.box{max-width:min(75%,600px)}

.user{
    font-size:11px;
    color:#cdd2aa;
    margin:0 3px 3px;
}

.mine .user{text-align:right}

.bubble{
    background:var(--army);
    border:1px solid #c96a6a;
    border-radius:13px;
    padding:9px 12px;
    color:#fff;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
    box-shadow:0 2px 5px #0003;
}

.mine .bubble{
    background:var(--red);
    color:#fff;
    border-color:var(--red-light);
}

.time{
    font-size:10px;
    color:#aeb394;
    margin:3px;
}

.mine .time{text-align:right}

/* COMPOSER */
.composer{
    display:flex;
    gap:8px;
    padding:10px;
    background:var(--army);
    border-top:2px solid #c95f5f;
}

.composer input{
    flex:1;
    background:var(--army-input);
    color:#fff;
    border:1px solid var(--red);
    border-radius:22px;
    padding:11px 14px;
    outline:0;
}

.composer input::placeholder{color:#aeb394}

.composer input:focus{
    border-color:var(--red-light);
    box-shadow:0 0 0 2px #d96b6b33;
}

.send{
    width:44px;
    border:1px solid var(--red-light);
    border-radius:50%;
    background:var(--red);
    color:#fff;
    transition:.15s;
}

.send:hover{
    background:var(--red-dark);
    transform:scale(1.05);
}

.send:disabled{opacity:.5}

/* MOBILE */
@media(max-width:650px){
    .side{width:68px}
    .brand{font-size:0;text-align:center}
    .me{justify-content:center}
    .meinfo,.logout{display:none}
    .room{text-align:center;font-size:0}
    .room:before{content:"💬";font-size:22px}
    .head{height:56px;padding:0 10px}
    .status{display:none}
    .messages{padding:10px}
    .box{max-width:88%}
}
</style>
</head>
<body>
<section id="auth"><div class="card">
<div class="logo">💬</div><h1>Chat Nhóm</h1><p class="desc">Đăng nhập bằng tài khoản + mật khẩu</p>
<div class="tabs"><button id="loginTab" class="tab active" type="button">Đăng nhập</button><button id="registerTab" class="tab" type="button">Đăng ký</button></div>
<form id="form">
<div class="field"><label>Tài khoản</label><input id="username" maxlength="30" required placeholder="Ví dụ: thanh"></div>
<div class="field"><label>Mật khẩu</label><input id="password" type="password" minlength="6" required placeholder="Tối thiểu 6 ký tự"></div>
<div id="confirmBox" class="field hidden"><label>Nhập lại mật khẩu</label><input id="confirm" type="password" minlength="6"></div>
<button id="submit" class="primary">Đăng nhập</button><div id="msg" class="msg"></div>
</form></div></section>

<section id="app" class="hidden">
<aside class="side"><div class="brand">💬 CHAT</div>
<div class="me"><div id="avatar" class="avatar">?</div><div class="meinfo"><div id="myName" class="name"></div><div id="role" class="role">Thành viên</div></div><button id="logout" class="logout">↪</button></div>
<div class="room">Phòng chung</div></aside>
<main class="chat"><div class="head"><b>Phòng chung</b><span class="live">● Realtime</span><span id="status" class="status">Đang kết nối...</span></div>
<div id="messages" class="messages"></div>
<form id="sendForm" class="composer"><input id="message" maxlength="2000" placeholder="Nhập tin nhắn..." autocomplete="off"><button id="send" class="send">➤</button></form></main>
</section>

<script>
const SUPABASE_URL="https://xowmhluzkljftsajjfhz.supabase.co";
const SUPABASE_KEY="sb_publishable_mZIMNlMuc64aB7ns2SZxmw_4Nugl6PO";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let mode="login",user=null,roomId=null,channel=null;
const $=id=>document.getElementById(id);

function show(t,ok=false){$("msg").textContent=t;$("msg").className="msg"+(ok?" ok":"")}
function setMode(m){mode=m;$("loginTab").classList.toggle("active",m==="login");$("registerTab").classList.toggle("active",m==="register");$("confirmBox").classList.toggle("hidden",m!=="register");$("submit").textContent=m==="register"?"Đăng ký":"Đăng nhập";show("")}
$("loginTab").onclick=()=>setMode("login");$("registerTab").onclick=()=>setMode("register");
function internalEmail(u){return u.toLowerCase()+"@chat.local"}

$("form").onsubmit=async e=>{
 e.preventDefault();const username=$("username").value.trim(),password=$("password").value;
 if(!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)){show("Tài khoản 3-30 ký tự, chỉ chữ/số/._-");return}
 if(password.length<6){show("Mật khẩu tối thiểu 6 ký tự.");return}
 if(mode==="register"&&password!==$("confirm").value){show("Hai mật khẩu không giống nhau.");return}
 $("submit").disabled=true;
 try{
  const email=internalEmail(username);
  const r=mode==="register"
   ?await db.auth.signUp({email,password,options:{data:{username}}})
   :await db.auth.signInWithPassword({email,password});
  if(r.error)throw r.error;
  if(mode==="register"&&!r.data.session){show("Tài khoản đã tạo. Hãy tắt Confirm email trong Supabase để đăng nhập ngay.",true)}
 }catch(err){console.error(err);let t=err.message||"Có lỗi xảy ra";if(t.toLowerCase().includes("invalid login credentials"))t="Tài khoản hoặc mật khẩu không đúng.";if(t.toLowerCase().includes("already registered"))t="Tài khoản đã tồn tại.";show(t)}
 finally{$("submit").disabled=false;$("submit").textContent=mode==="register"?"Đăng ký":"Đăng nhập"}
};

db.auth.onAuthStateChange(async(_,session)=>{if(session?.user)await open(session.user);else closeApp()});

async function open(u){
 user=u;$("auth").classList.add("hidden");$("app").classList.remove("hidden");
 const username=u.user_metadata?.username||u.email.split("@")[0];$("myName").textContent=username;$("avatar").textContent=username[0].toUpperCase();
 const a=await db.from("accounts").select("is_admin").eq("id",u.id).maybeSingle();if(!a.error&&a.data?.is_admin)$("role").textContent="Quản trị viên";
 const rr=await db.from("rooms").select("id,name").order("id").limit(1);
 if(rr.error||!rr.data?.length){$("messages").innerHTML="<p>Chưa có phòng chat.</p>";return}
 roomId=rr.data[0].id;await load();realtime();
}
function closeApp(){if(channel){db.removeChannel(channel);channel=null}$("app").classList.add("hidden");$("auth").classList.remove("hidden")}
$("logout").onclick=()=>db.auth.signOut();

async function load(){
 const r=await db.from("messages").select("id,room_id,user_id,username,content,created_at").eq("room_id",roomId).order("created_at",{ascending:true}).limit(100);
 if(r.error){console.error(r.error);$("messages").innerHTML="<p>Không tải được tin nhắn.</p>";return}
 $("messages").innerHTML="";r.data.forEach(add);$("messages").scrollTop=$("messages").scrollHeight;
}
function add(m){
 if(Number(m.room_id)!==Number(roomId)||$("messages").querySelector('[data-id="'+m.id+'"]'))return;
 const row=document.createElement("div");row.className="row"+(user&&m.user_id===user.id?" mine":"");row.dataset.id=m.id;
 const box=document.createElement("div");box.className="box";const u=document.createElement("div");u.className="user";u.textContent=m.username;
 const b=document.createElement("div");b.className="bubble";b.textContent=m.content;const t=document.createElement("div");t.className="time";t.textContent=new Date(m.created_at).toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
 box.append(u,b,t);row.append(box);$("messages").append(row);
}
$("sendForm").onsubmit=async e=>{
 e.preventDefault();const content=$("message").value.trim();if(!content||!roomId)return;
 $("send").disabled=true;
 const r=await db.from("messages").insert({room_id:roomId,user_id:user.id,username:$("myName").textContent,content}).select().single();
 $("send").disabled=false;if(r.error){alert(r.error.message);return}
 $("message").value="";$("message").focus();
};
function realtime(){
 if(channel)db.removeChannel(channel);
 channel=db.channel("chat-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+roomId},p=>{add(p.new);$("messages").scrollTop=$("messages").scrollHeight}).subscribe(s=>{$("status").textContent=s==="SUBSCRIBED"?"● Đã kết nối":"● "+s;$("status").style.color=s==="SUBSCRIBED"?"#15803d":"#64748b"});
}
(async()=>{const r=await db.auth.getSession();if(r.data.session)await open(r.data.session.user)})();
</script>
</body>
</html>
