<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M3U8 STREAM SCANNING</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#050805;
  --panel:#0a110a;
  --panel2:#050905;
  --border:#173817;
  --text:#b7ffb7;
  --muted:#5f9b5f;
  --accent:#20e020;
  --accent2:#13b913;
  --danger:#ef4444;
  --ok:#20e020;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#030603;
  color:#b7ffb7;
  font-family:Arial,Helvetica,sans-serif;
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:22px;
}

header{
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:23px;
  color:#45ff45;
  letter-spacing:1px;
  text-shadow:0 0 8px rgba(32,224,32,.28);
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:#081008;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
}

.player{
  background:#000;
  border-radius:11px;
  overflow:hidden;
  aspect-ratio:16/9;
}

video{
  display:block;
  width:100%;
  height:100%;
  background:#000;
}

.status{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  background:var(--panel2);
  color:var(--muted);
  font-size:13px;
  min-height:44px;
  word-break:break-word;
}

.status.ok{color:#86efac}
.status.error{color:#fca5a5}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

/* ===== RESPONSIVE + iOS SAFARI ===== */
html, body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

select,
input{
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  width:100%;
  height:44px;
  padding:6px 10px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  background:#050905;
  color:var(--text);
  font-size:16px;
}

#manualChannelInput{
  height:44px;
}

#templateSelect,
#channelSelect{
  height:44px;
}

#vidCurrent{
  height:44px;
  padding:6px;
}

select:focus,
input:focus{
  border-color:var(--accent);
}

#vidCurrent{
  width:90px;
  height:44px;
  padding:6px;
  text-align:center;
  font-weight:700;
  font-family:Consolas,monospace;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
/* Ô nhập kênh thủ công */
.manual-channel-row{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
}
.manual-channel-row input{
  flex:1 1 360px;
  min-width:0;
}
.manual-channel-actions{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}
.manual-channel-actions button{
  white-space:nowrap;
}

.channel-actions{
  margin-top:8px;
}

.channel-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.channel-row select{
  flex:1 1 360px;
  min-width:260px;
  width:100%;
}

.channel-nav{
  position:relative;
  z-index:30;
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
  flex-wrap:nowrap;
  white-space:nowrap;
}

.channel-nav button{
  position:relative;
  z-index:31;
  pointer-events:auto;
  white-space:nowrap;
}

@media(max-width:600px){

  /* ===== iPHONE / SAFARI: KHÔNG CHO BẤT KỲ HÀNG NÀO TRÀN NGANG ===== */
  .app{
    width:100%;
    max-width:100%;
    padding:12px max(12px, env(safe-area-inset-right))
             12px max(12px, env(safe-area-inset-left));
  }

  .card,
  .grid,
  .grid > div,
  .panel-body,
  .channel-row,
  .manual-channel-row,
  .url-row,
  .vid-scan-control{
    min-width:0;
    max-width:100%;
  }

  /* Ô nhập kênh */
  .manual-channel-row{
    flex-direction:column;
    align-items:stretch;
    gap:8px;
  }

  .manual-channel-row input{
    width:100%;
    min-width:0;
    flex:0 0 44px;
    height:44px;
    font-size:16px;
  }

  .manual-channel-actions{
    display:flex;
    width:100%;
    min-width:0;
    gap:8px;
  }

  .manual-channel-actions button{
    flex:1 1 0;
    min-width:0;
    width:0;
    height:44px;
    padding:8px 5px;
    font-size:12px;
    white-space:normal;
  }

  /* Chọn list kênh */
  .channel-row{
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:8px;
  }

  .channel-row select{
    width:100%;
    min-width:0;
    flex:0 0 auto;
  }

  /* 4 nút chia thành 2 x 2 để không tràn màn hình iPhone */
  .channel-nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    width:100%;
    min-width:0;
    gap:8px;
  }

  .channel-nav button{
    width:100%;
    min-width:0;
    flex:initial;
    padding:9px 4px;
    font-size:11px;
    line-height:1.15;
    white-space:normal;
    overflow-wrap:anywhere;
  }
}

.vid-scan-control{
  display:flex;
  align-items:flex-end;
  gap:8px;
  margin-top:10px;
}

.vid-scan-control .vid-scan-actions{
  margin-top:0;
  flex:1;
}

.vid-scan-control .vid-scan-actions button{
  width:100%;
}

.vid-scan-number{
  flex:0 0 100px;
}

.vid-scan-number label{
  text-align:center;
}

.vid-scan-number input{
  width:100px;
  box-sizing:border-box;
}

.vid-scan-nav{
  display:flex;
  gap:8px;
  flex:1;
}

.vid-scan-nav button{
  flex:1;
}

.vid-scan-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.vid-scan-actions button{
  width:100%;
}

@media (max-width:600px){
  .vid-scan-control{
    flex-wrap:wrap;
    width:100%;
    min-width:0;
  }

  .vid-scan-number{
    flex:0 0 100%;
    width:100%;
  }

  .vid-scan-number input{
    display:block;
    margin:auto;
  }

  .vid-scan-nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    width:100%;
    min-width:0;
    gap:8px;
  }

  .vid-scan-nav button{
    width:100%;
    min-width:0;
    padding:9px 4px;
    font-size:11px;
    line-height:1.15;
    white-space:normal;
  }

  .vid-scan-control .vid-scan-actions{
    width:100%;
    min-width:0;
  }

  .vid-scan-actions{
    grid-template-columns:1fr;
  }

  .vid-scan-actions button{
    min-width:0;
    white-space:normal;
    font-size:11px;
  }
}

button{
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  position: relative;
  z-index: 20;
  border:1px solid #25d925;
  border-radius:7px;
  padding:10px 14px;
  background:#0b240b;
  color:#7dff7d;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
  min-height:44px;
  -webkit-touch-callout:none;
}

button:hover{
  background:#123812;
  color:#b7ffb7;
  box-shadow:0 0 8px rgba(32,224,32,.18);
}

button:disabled{
  opacity:.65;
  cursor:not-allowed;
  box-shadow:none;
}

button.secondary{
  background:#0b1a0b;
  color:#8cff8c;
  border:1px solid #1c4d1c;
}

button.secondary:hover{
  background:#102410;
  color:#b7ffb7;
}

button.danger{
  background:var(--danger);
  color:#fff;
  border-color:#dc2626;
}

button.danger:hover{
  background:#dc2626;
  color:#fff;
}

.counter{
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
}

/* ===== BẢNG KẾT QUẢ DÒ ===== */
.result-table-wrap {
  margin-top:12px;
  max-height:300px;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel2);
  -webkit-overflow-scrolling:touch;
}

.result-table {
  width:100%;
  border-collapse:collapse;
  font-size:13px;
  min-width:550px;
}

.result-table thead {
  position:sticky;
  top:0;
  z-index:10;
}

.result-table th {
  background:#0d1a0d;
  color:#86efac;
  padding:10px 12px;
  text-align:left;
  border-bottom:2px solid var(--border);
  font-weight:700;
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:0.5px;
}

.result-table td {
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
  color:var(--text);
}

.result-table tr.found {
  background:#0b1a0b;
}

.result-table tr.found td {
  color:#86efac;
}

.result-table .link-cell {
  max-width:300px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-family:Consolas,monospace;
  font-size:12px;
  color:#b7ffb7;
  cursor:pointer;
  -webkit-touch-callout:none;
}

.result-table .link-cell:hover {
  color:#45ff45;
}

.result-summary {
  padding:10px 12px;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}

.result-summary .found-count {
  color:#86efac;
  font-weight:700;
}

.no-results {
  padding:30px 20px;
  text-align:center;
  color:var(--muted);
  font-style:italic;
}

.copy-btn {
  padding:6px 12px;
  font-size:10px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  border-radius:4px;
  text-transform:none;
  font-weight:400;
  white-space:nowrap;
  min-height:32px;
}

.copy-btn:hover {
  background:var(--border);
  color:var(--text);
}

.found-badge {
  display:inline-block;
  padding:2px 10px;
  border-radius:4px;
  font-size:10px;
  font-weight:700;
  text-transform:uppercase;
  background:#20e020;
  color:#000;
}

@media(max-width:600px){
  .result-table-wrap {
    max-height:250px;
  }
  
  .result-table {
    font-size:11px;
    min-width:380px;
  }
  
  .result-table th,
  .result-table td {
    padding:6px 8px;
  }
  
  .result-table .link-cell {
    max-width:120px;
    font-size:10px;
  }
  
  .copy-btn {
    padding:4px 8px;
    font-size:9px;
    min-height:28px;
  }
}

@media(max-width:760px){
  .grid{
    grid-template-columns:1fr;
    min-width:0;
  }

  h1{
    font-size:22px;
    overflow-wrap:anywhere;
  }

  select,
  input{
    width:100%;
    max-width:100%;
    min-width:0;
    height:44px;
    padding:6px 10px;
    font-size:16px;
  }

  #manualChannelInput,
  #channelSelect,
  #templateSelect{
    width:100%;
    max-width:100%;
    min-width:0;
    height:44px;
  }

  #vidCurrent{
    width:90px;
    max-width:100%;
    height:44px;
  }

  .status,
  .counter{
    max-width:100%;
    overflow-wrap:anywhere;
  }
}

.scan-panel{
  overflow:hidden;
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:0;
}
.panel-head label{
  margin:0;
}
.panel-toggle{
  padding:7px 11px;
  font-size:11px;
  text-transform:uppercase;
  white-space:nowrap;
  min-height:36px;
}
.panel-body{
  margin-top:12px;
}
.panel-body.is-hidden{
  display:none;
}


/* ===== SAFARI FINAL OVERFLOW GUARD ===== */
.card > *,
.panel-body > *,
.grid > *,
.channel-row > *,
.url-row > *,
.vid-scan-control > *{
  max-width:100%;
  min-width:0;
}

button{
  max-width:100%;
  box-sizing:border-box;
}

/* Scrollbar style */
.result-table-wrap::-webkit-scrollbar {
  width:6px;
  height:6px;
}
.result-table-wrap::-webkit-scrollbar-track {
  background:var(--panel2);
}
.result-table-wrap::-webkit-scrollbar-thumb {
  background:var(--border);
  border-radius:3px;
}
.result-table-wrap::-webkit-scrollbar-thumb:hover {
  background:var(--muted);
}

/* ===== BẢNG KẾT QUẢ FREEM3U NGAY TRONG PANEL ===== */
.vid-result-list {
  margin-top:12px;
  max-height:250px;
  overflow-y:auto;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--panel2);
  -webkit-overflow-scrolling:touch;
}

.vid-result-item {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 12px;
  border-bottom:1px solid var(--border);
  gap:10px;
  flex-wrap:wrap;
}

.vid-result-item:last-child {
  border-bottom:none;
}

.vid-result-item .vid-number {
  font-weight:700;
  color:var(--accent);
  min-width:50px;
  font-size:13px;
}

.vid-result-item .vid-link {
  flex:1;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-family:Consolas,monospace;
  color:var(--text);
  cursor:pointer;
}

.vid-result-item .vid-link:hover {
  color:#45ff45;
}

.vid-result-item .vid-copy-btn {
  padding:4px 10px;
  font-size:10px;
  background:transparent;
  border:1px solid var(--border);
  color:var(--muted);
  cursor:pointer;
  border-radius:4px;
  text-transform:none;
  font-weight:400;
  min-height:28px;
  white-space:nowrap;
}

.vid-result-item .vid-copy-btn:hover {
  background:var(--border);
  color:var(--text);
}

.vid-result-empty {
  padding:20px;
  text-align:center;
  color:var(--muted);
  font-style:italic;
  font-size:13px;
}

.vid-result-summary {
  padding:8px 12px;
  color:var(--muted);
  font-size:12px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:6px;
}

.vid-result-summary .vid-found-count {
  color:#86efac;
  font-weight:700;
}

.vid-result-summary .vid-clear-btn {
  padding:3px 10px;
  font-size:10px;
  background:transparent;
  border:1px solid #ef4444;
  color:#ef4444;
  cursor:pointer;
  border-radius:4px;
  text-transform:none;
  font-weight:400;
  min-height:28px;
  white-space:nowrap;
}

.vid-result-summary .vid-clear-btn:hover {
  background:#ef4444;
  color:#fff;
}

/* Result section trong channel panel */
.result-section {
  margin-top:16px;
  border-top:1px solid var(--border);
  padding-top:14px;
}

.result-section .result-label {
  color:var(--muted);
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.result-section .result-clear-btn {
  padding:3px 10px;
  font-size:10px;
  background:transparent;
  border:1px solid #ef4444;
  color:#ef4444;
  cursor:pointer;
  border-radius:4px;
  text-transform:none;
  font-weight:400;
  min-height:28px;
  white-space:nowrap;
}

.result-section .result-clear-btn:hover {
  background:#ef4444;
  color:#fff;
}

</style>
</head>

<body>
<div class="app">

<header>
  <h1>⌨ M3U8 // STREAM SCANNING</h1>
  </header>

<!-- PLAYER -->
<div class="card">
  <div class="player">
    <video id="video" controls playsinline webkit-playsinline x-webkit-airplay="allow"></video>
  </div>

  <div id="status" class="status">
    ⚪ Chưa phát stream
  </div>
</div>

<!-- DÒ KÊNH THỦ CÔNG + BẢNG KẾT QUẢ -->
<div class="card scan-panel" id="channelPanel">
  <div class="panel-head">
    <label>▸ DÒ KÊNH THỦ CÔNG</label>
    <button class="secondary panel-toggle" type="button"
            onclick="togglePanel('channelBody','channelToggle')" aria-expanded="true"
            aria-label="Toggle channel panel">
      <span id="channelToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="channelBody">
    <div class="grid">
      <div>
        <div class="manual-channel-row">
          <input id="manualChannelInput" type="text"
                 placeholder="Ví dụ: vtv1" autocomplete="off"
                 aria-label="Nhập tên kênh thủ công">
          <div class="manual-channel-actions">
            <button class="secondary" onclick="useManualChannel()" aria-label="Dùng kênh thủ công">DÙNG KÊNH</button>
            <button class="danger" onclick="clearManualChannel()" aria-label="Xóa kênh thủ công">XÓA KÊNH</button>
          </div>
        </div>

        <div class="counter">
          Kênh nhập thủ công chỉ dùng trong lần này — không lưu lại sau khi F5.
        </div>

        <label style="margin-top:12px">▸ CHỌN LIST KÊNH</label>
        <div class="channel-row">
          <select id="channelSelect" aria-label="Chọn kênh"></select>
          <div class="channel-nav">
            <button id="prevChannelBtn" class="secondary" type="button" aria-label="Kênh trước">⬅ KÊNH TRƯỚC</button>
            <button id="nextChannelBtn" class="secondary" type="button" aria-label="Kênh sau">KÊNH SAU ➡</button>
            <button id="autoScanBtn" class="danger" type="button" aria-label="Dò tự động">⚡ DÒ TỰ ĐỘNG</button>
            <button id="resetAutoScanBtn" class="secondary" type="button" aria-label="Dò lại từ đầu">↻ DÒ LẠI TỪ ĐẦU</button>
          </div>
        </div>
        <div id="channelCounter" class="counter"></div>
      </div>

      <div>
        <label>▸ STREAM SOURCE</label>
        <select id="templateSelect" aria-label="Chọn link stream"></select>
        <div id="linkCounter" class="counter"></div>
      </div>
    </div>

    <!-- BẢNG KẾT QUẢ NGAY TRONG PANEL -->
    <div class="result-section">
      <div class="result-label">
        <span>▸ STREAM URL RESULT</span>
      </div>
      <div class="result-table-wrap" id="resultTableWrap">
        <table class="result-table" id="resultTable">
          <thead>
            <tr>
              <th style="width:50px;">STT</th>
              <th style="width:140px;">TÊN LINK</th>
              <th>ĐƯỜNG DẪN</th>
              <th style="width:80px;">CHẤT LƯỢNG</th>
              <th style="width:70px;">COPY</th>
            </tr>
          </thead>
          <tbody id="resultBody">
          </tbody>
        </table>
      </div>
      <div class="result-summary" id="resultSummary">
        <span>🔍 Tổng số link phát được: <span class="found-count" id="foundLinks">0</span></span>
        <button class="result-clear-btn" onclick="clearResults()">🗑 XÓA</button>
      </div>
    </div>
  </div>
</div>

<!-- DÒ KÊNH FREEM3U -->
<div class="card scan-panel" id="vidScanPanel">
  <div class="panel-head">
    <label>▸ FREEM3U // DÒ KÊNH THEO SỐ</label>
    <button class="secondary panel-toggle" type="button"
            onclick="togglePanel('vidScanBody','vidScanToggle')"
            aria-expanded="true"
            aria-label="Toggle FreeM3U panel">
      <span id="vidScanToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="vidScanBody">
    <div class="vid-scan-control">
      <div class="vid-scan-number">
        <label>SỐ ĐANG DÒ</label>
        <input id="vidCurrent" value="1" readonly aria-label="Số kênh đang dò">
      </div>

      <div class="vid-scan-nav">
        <button id="vidScanBtn" class="danger" onclick="startVidScan()" aria-label="Dò tới">🔎 DÒ TỚI</button>
        <button class="secondary" onclick="scanBackward()" aria-label="Dò lùi">◀️ DÒ LÙI</button>
      </div>

function isIOS() {

         (/AppleWebKit/.test(navigator.userAgent) && /Mobile/.test(navigator.userAgent));
}

function isHlsSupported() {

function isHlsEventsAvailable() {

/*
   iOS/Safari BUTTON HANDLERS - Tối ưu cho touch
*/
function bindIOSButton(button, handler) {
  if (!button) return;

  let lastTouch = 0;
  let isTouching = false;

  button.addEventListener("touchstart", function(event) {
    isTouching = true;
    lastTouch = Date.now();
  }, {passive:true});

  button.addEventListener("touchend", function(event) {
    if (isTouching) {
      isTouching = false;
      event.preventDefault();
      event.stopPropagation();
      setTimeout(() => handler(), 50);
    }
  }, {passive:false});

  button.addEventListener("click", function(event) {
    if (Date.now() - lastTouch < 300) {
      event.preventDefault();
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    handler();
  }, false);
}

function copyToClipboard(text) {
  if (!text) return;
  
  // iOS fallback
  if (isIOS()) {
    const tempInput = document.createElement('input');
    tempInput.value = text;
    tempInput.style.position = 'fixed';
    tempInput.style.opacity = '0';
    tempInput.style.top = '-100px';
    tempInput.style.left = '-100px';
    document.body.appendChild(tempInput);
    tempInput.select();
    tempInput.setSelectionRange(0, 99999);
    
    try {
      document.execCommand('copy');
      setStatus("📋 Đã copy: " + text.substring(0, 50) + (text.length > 50 ? '...' : ''), "ok");
    } catch (e) {
      setStatus("❌ Không thể copy", "error");
    }
    document.body.removeChild(tempInput);
    return;
  }
  
  // Modern browsers
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      setStatus("📋 Đã copy: " + text.substring(0, 50) + (text.length > 50 ? '...' : ''), "ok");
    }).catch(() => {
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  const textarea = document.createElement('textarea');
  textarea.value = text;
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    setStatus("📋 Đã copy: " + text.substring(0, 50) + (text.length > 50 ? '...' : ''), "ok");
  } catch (e) {
    setStatus("❌ Không thể copy", "error");
  }
  document.body.removeChild(textarea);
}

/* =========================================================
   PHÁT URL - TỐI ƯU CHO iOS
========================================================= */

function setupHlsPlayback(url, {
  onPlaying,
  onError,
  timeout = 15000
} = {}) {
  let finished = false;
  let timer = null;
  let nativeCleanup = null;

  const cleanup = () => {
    clearTimeout(timer);
    if (activeNativeTimeout) {
      clearTimeout(activeNativeTimeout);
      activeNativeTimeout = null;
    }
    if (nativeCleanup) {
      nativeCleanup();
      nativeCleanup = null;
    }
    if (onPlaying) {
      video.removeEventListener("playing", onVideoPlaying);
    }
    if (onError) {
      video.removeEventListener("error", onVideoError);
    }
    if (hls && isHlsEventsAvailable()) {
      hls.off(Hls.Events.MANIFEST_PARSED, onManifestParsed);
      hls.off(Hls.Events.ERROR, onHlsError);
    }
  };

  const finish = (success) => {
    if (finished) return;
    finished = true;
    cleanup();

    if (success) {
      if (onPlaying) onPlaying();
    } else if (onError) {
      onError();
    }
  };

  const onManifestParsed = () => {
    video.play().catch(() => {});
  };

  const onHlsError = (event, data) => {
    if (data && data.fatal) {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      finish(false);
    }
  };

  const onVideoPlaying = () => finish(true);
  const onVideoError = () => finish(false);

  if (onPlaying) {
    video.addEventListener("playing", onVideoPlaying, {once:true});
  }
  if (onError) {
    video.addEventListener("error", onVideoError, {once:true});
  }

  // ƯU TIÊN NATIVE HLS CHO iOS
  if (isIOS() && isNativeHLSSupported()) {
    const onLoadedMetadata = () => {
      if (nativeCleanup) nativeCleanup();
      video.play().catch(() => {});
    };
    const onErrorNative = () => {
      if (nativeCleanup) nativeCleanup();
      finish(false);
    };
    
    nativeCleanup = () => {
      video.removeEventListener("loadedmetadata", onLoadedMetadata);
      video.removeEventListener("error", onErrorNative);
    };
    
    video.addEventListener("loadedmetadata", onLoadedMetadata, {once:true});
    video.addEventListener("error", onErrorNative, {once:true});
    video.src = url;
    video.load();
    
    activeNativeTimeout = setTimeout(() => {
      if (!finished) {
        finish(false);
      }
    }, timeout);
  }
  // HLS.js cho Android/PC
  else if (isHlsSupported()) {
    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:30
    });

    if (isHlsEventsAvailable()) {
      hls.on(Hls.Events.MANIFEST_PARSED, onManifestParsed);
      hls.on(Hls.Events.ERROR, onHlsError);
    }

    hls.loadSource(url);
    hls.attachMedia(video);
  }
  // Native HLS fallback
  else if (isNativeHLSSupported()) {
    const onLoadedMetadata = () => {
      if (nativeCleanup) nativeCleanup();
      video.play().catch(() => {});
    };
    const onErrorNative = () => {
      if (nativeCleanup) nativeCleanup();
      finish(false);
    };
    
    nativeCleanup = () => {
      video.removeEventListener("loadedmetadata", onLoadedMetadata);
      video.removeEventListener("error", onErrorNative);
    };
    
    video.addEventListener("loadedmetadata", onLoadedMetadata, {once:true});
    video.addEventListener("error", onErrorNative, {once:true});
    video.src = url;
    video.load();
  }
  else {
    finish(false);
    return;
  }

  timer = setTimeout(() => finish(false), timeout);

  return {
    cancel: () => finish(false)
  };
}

function playUrl(url,index) {
  video.muted = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  destroyPlayer();

  currentPlayingLink = index;

  setStatus(
    "⏳ Đang kết nối Link " +
    (index + 1) +
    "..."
  );

  const cancel = setupHlsPlayback(url, {
    onPlaying: () => {
      setStatus(
        "🟢 Đang phát — Link " +
        (index + 1),
        "ok"
      );
    },
    onError: () => {
      setStatus(
        "🔴 Không phát được Link " +
        (index + 1),
        "error"
      );
    }
  });
  activePlaybackCancel = cancel ? cancel.cancel : null;
}

/* =========================================================
   DÒ LINK TỰ ĐỘNG - TỐI ƯU CHO iOS
========================================================= */

function setAutoScanButton(scanning) {
  const btn = document.getElementById("autoScanBtn");
  if(!btn) return;

  btn.disabled = !!scanning;
  btn.textContent = scanning
    ? "⏳ ĐANG DÒ..."
    : "⚡ DÒ TỰ ĐỘNG";
}

function tryAutoScanLink(index, token) {
  return new Promise((resolve) => {
    if(token !== autoScanToken) { resolve(false); return; }

    const url = getUrl(index);
    currentPlayingLink = index;
    templateSelect.selectedIndex = index;

    setStatus("🔎 Đang kiểm tra " + getActiveChannelCode() + " — Link " + (index + 1) + "/" + templates.length + "...");

    let done = false;
    let timer = null;
    let probeHls = null;
    let nativeCleanup = null;
    let probeCancel = null;
    let nativeTimeout = null;

    const finish = (ok) => {
      if(done) return;
      done = true;
      clearTimeout(timer);
      if (nativeTimeout) {
        clearTimeout(nativeTimeout);
        nativeTimeout = null;
      }
      
      if(probeHls) {
        const probe = probeHls;
        probeHls = null;
        if (activeProbeHls === probe) {
          activeProbeHls = null;
        }
        try { probe.destroy(); } catch(e) {}
      }
      
      if(nativeCleanup) {
        nativeCleanup();
        nativeCleanup = null;
      }
      if (probeCancel) {
        probeCancel();
        probeCancel = null;
      }
      
      if (ok) {
        addFoundResult(index, url);
      }
      
      resolve(ok);
    };

    timer = setTimeout(() => finish(false), 15000);

    // ƯU TIÊN NATIVE HLS CHO iOS
    if (isIOS() && isNativeHLSSupported()) {
      const onLoadedMetadata = () => {
        if (nativeCleanup) nativeCleanup();
        finish(true);
      };
      const onError = () => {
        if (nativeCleanup) nativeCleanup();
        finish(false);
      };
      
      nativeCleanup = () => {
        video.removeEventListener("loadedmetadata", onLoadedMetadata);
        video.removeEventListener("error", onError);
        video.removeAttribute("src");
        video.load();
      };
      
      video.addEventListener("loadedmetadata", onLoadedMetadata, {once:true});
      video.addEventListener("error", onError, {once:true});
      video.src = url;
      video.load();
      
      nativeTimeout = setTimeout(() => {
        if (!done) {
          finish(false);
        }
      }, 10000);
      return;
    }

    // HLS.js cho Android/PC
    if(isHlsSupported()) {
      try {
        probeHls = new Hls({ enableWorker:true, lowLatencyMode:true, backBufferLength:30 });
        activeProbeHls = probeHls;
        
        if (isHlsEventsAvailable()) {
          probeHls.once(Hls.Events.MANIFEST_PARSED, () => finish(true));
          probeHls.once(Hls.Events.ERROR, (event, data) => {
            if(data && data.fatal) {
              if(probeHls) {
                probeHls.destroy();
                probeHls = null;
                if (activeProbeHls === probeHls) activeProbeHls = null;
              }
              finish(false);
            }
          });
        } else {
          setTimeout(() => finish(false), 5000);
        }
        
        probeHls.attachMedia(video);
        probeHls.loadSource(url);
      } catch(e) {
        console.error("Probe HLS:", e);
        if(probeHls) {
          probeHls.destroy();
          probeHls = null;
          if (activeProbeHls === probeHls) activeProbeHls = null;
        }
        finish(false);
      }
      return;
    }

    finish(false);
  });
}

function autoScanLinks() {
  if(autoScanning) {
    setStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  const input = document.getElementById("manualChannelInput");
  const typedCode = input ? input.value.trim() : "";

  if(typedCode) {
    if(typedCode !== manualChannelCode.trim()) {
      manualChannelCode = typedCode;
      autoScanNextIndex = 0;
      autoScanToken++;
    } else {
      manualChannelCode = typedCode;
    }
  }

  const code = getActiveChannelCode().trim();
  if(!code) {
    setStatus("⚠️ Chưa có mã kênh để dò", "error");
    return;
  }

  foundResults = [];
  lastFoundIndex = null;
  updateResultTable();

  if(autoScanNextIndex >= templates.length) {
    setStatus("⚪ " + code + " đã dò hết " + templates.length + " link — bấm DÒ LẠI TỪ ĐẦU", "error");
    return;
  }

  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  setVidScanButton(false);

  cancelActiveProbe();

  autoScanning = true;
  autoScanToken++;
  const token = autoScanToken;
  let index = autoScanNextIndex;
  setAutoScanButton(true);

  const scanNext = () => {
    if(token !== autoScanToken || !autoScanning) {
      autoScanTimers = [];
      return;
    }

    if(index >= templates.length) {
      autoScanNextIndex = templates.length;
      autoScanning = false;
      setAutoScanButton(false);
      autoScanTimers = [];
      
      const foundCount = foundResults.length;
      if (foundCount > 0) {
        if (lastFoundIndex !== null) {
          templateSelect.selectedIndex = lastFoundIndex;
          updateUrl();
          setTimeout(() => {
            playUrl(getUrl(lastFoundIndex), lastFoundIndex);
          }, 300);
          setStatus("✅ Dò xong! Tìm thấy " + foundCount + " link. Đang phát link cuối cùng (Link " + (lastFoundIndex + 1) + ")", "ok");
        } else {
          setStatus("✅ Dò xong! Tìm thấy " + foundCount + " link phát được cho " + code, "ok");
        }
      } else {
        setStatus("🔴 Đã dò hết " + templates.length + " link, không tìm thấy link nào phát được", "error");
      }
      return;
    }

    const testIndex = index++;
    autoScanNextIndex = index;

    tryAutoScanLink(testIndex, token).then(success => {
      if(token !== autoScanToken || !autoScanning) {
        autoScanTimers = [];
        return;
      }

      if(success) {
        setStatus("✅ Tìm thấy link " + (testIndex + 1) + " — tiếp tục dò...", "ok");
      }

      const timer = setTimeout(scanNext, isIOS() ? 100 : 30);
      autoScanTimers.push(timer);
    }).catch(err => {
      console.error("Auto scan:", err);
      if(token === autoScanToken && autoScanning) {
        const timer = setTimeout(scanNext, isIOS() ? 200 : 100);
        autoScanTimers.push(timer);
      } else {
        autoScanTimers = [];
      }
    });
  };

  templateSelect.selectedIndex = 0;
  updateUrl();
  setStatus("🔎 Bắt đầu dò kênh " + code + " từ Link 1...");
  setTimeout(scanNext, isIOS() ? 100 : 0);
}

/* =========================================================
   FREEM3U // DÒ KÊNH THEO SỐ
========================================================= */

function getVidUrl(number) {
  return "https://freem3u.xyz/api/live/play.m3u8?vid=" + number;
}

function setVidScanButton(scanning) {
  if(!vidScanBtn) return;

  vidScanBtn.disabled = scanning;
  vidScanBtn.textContent = scanning
    ? "⏳ ĐANG DÒ KÊNH..."
    : "🔎 DÒ TỚI";
}

function updateVidScanDisplay(number) {
  vidScanNumber = number;
  if(vidCurrent) vidCurrent.value = number;
}

function setVidScanStatus(text, type="") {
  if(!vidScanStatus) return;

  vidScanStatus.textContent = text;
  vidScanStatus.style.color =
    type === "ok" ? "#86efac" :
    type === "error" ? "#fca5a5" :
    "";
}

function tryVidNumber(number, token) {
  return new Promise((resolve) => {
    if (token !== vidScanToken || !vidScanning) {
      resolve(false);
      return;
    }

    const url = getVidUrl(number);
    destroyPlayer();

    const cancelFn = setupHlsPlayback(url, {
      timeout: VID_SCAN_TIMEOUT,
      onPlaying: () => {
        // Khi phát thành công, lưu kết quả vào danh sách FreeM3U
        addVidFoundResult(number, url);
        resolve(true);
      },
      onError: () => resolve(false)
    });
    if (cancelFn) {
      activePlaybackCancel = cancelFn.cancel;
    } else {
      activePlaybackCancel = null;
    }
  });
}

function startVidScan() {
  if(vidScanning) {
    setVidScanStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  if(vidScanNumber > VID_SCAN_MAX) {
    setVidScanStatus(
      "🟢 Đã dò hết số 1 → " + VID_SCAN_MAX +
      (vidFoundResults.length
        ? " | Tìm thấy: " + vidFoundResults.map(r => r.number).join(", ")
        : " | Không tìm thấy kênh.")
    );
    return;
  }

  if(vidScanNumber === 1) {
    vidFoundResults = [];
    vidFoundNumbers = [];
    updateVidResultList();
  }

  vidScanning = true;
  vidScanToken++;
  cancelActiveProbe();

  const token = vidScanToken;
  setVidScanButton(true);

  function scanNext() {
    if(token !== vidScanToken || !vidScanning) return;

    if(vidScanNumber > VID_SCAN_MAX) {
      vidScanning = false;
      setVidScanButton(false);
      setVidScanStatus(
        vidFoundResults.length
          ? "🟢 Đã dò hết 1 → " + VID_SCAN_MAX +
            " | Tìm thấy: " + vidFoundResults.map(r => r.number).join(", ")
          : "🔴 Đã dò hết số 1 → " + VID_SCAN_MAX + " mà chưa tìm thấy kênh.",
        vidFoundResults.length ? "ok" : "error"
      );
      return;
    }

    const number = vidScanNumber;
    updateVidScanDisplay(number);

    setVidScanStatus(
      "🔎 Đang dò kênh số " + number + "/" + VID_SCAN_MAX + "..."
    );

    tryVidNumber(number, token).then((success) => {
      if(token !== vidScanToken || !vidScanning) return;

      if(success) {
        vidFoundNumbers.push(number);
        updateVidScanDisplay(number);

        freem3uPlaying = true;
        freem3uPlayingNumber = number;

        vidScanNumber = number + 1;
        vidScanning = false;
        if(vidScanBtn) vidScanBtn.disabled = false;

        setVidScanStatus(
          "🎯 TÌM THẤY TÍN HIỆU Ở KÊNH #" + number +
          " — ĐÃ DỪNG. Bấm DÒ TỚI để dò tiếp từ #" +
          vidScanNumber + ".",
          "ok"
        );

        setStatus(
          "🟢 FREEM3U — Tìm thấy kênh " + number +
          " — đã dừng dò để bạn xem."
        );

        updateVidResultList();
        return;
      }

      vidScanNumber = number + 1;
      setTimeout(scanNext, isIOS() ? 100 : 0);

    }).catch((error) => {
      console.log("FreeM3U scan:", error);

      if(token !== vidScanToken || !vidScanning) return;

      vidScanNumber = number + 1;
      setTimeout(scanNext, isIOS() ? 100 : 0);
    });
  }

  setTimeout(scanNext, isIOS() ? 100 : 0);
}

function scanBackward() {
  if(vidScanning) {
    setVidScanStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  const current = Number(
    vidCurrent ? vidCurrent.value : vidScanNumber
  );

  if(!Number.isFinite(current) || current < 1) {
    setVidScanStatus("⚪ Không xác định được số hiện tại để dò lùi.", "error");
    return;
  }

  const start = current - 1;

  if(start < 1) {
    setVidScanStatus("⚪ Đang ở số 1 — không còn số nhỏ hơn để dò lùi.");
    return;
  }

  vidScanNumber = start;
  startVidScan();
}

function stopVidScan() {
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  setVidScanButton(false);
  cancelActiveProbe();
  destroyPlayer();

  setVidScanStatus(
    "⚪ Đã dừng dò tại số " + vidScanNumber + ". Bấm DÒ TỚI để tiếp tục."
  );
  updateVidResultList();
}

function resetVidScan() {
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  vidScanNumber = 1;
  vidFoundNumbers = [];
  vidFoundResults = [];
  cancelActiveProbe();
  destroyPlayer();

  setVidScanButton(false);
  updateVidScanDisplay(1);
  updateVidResultList();

  setVidScanStatus(
    "🔄 Đã reset — lần dò tiếp theo bắt đầu từ kênh số 1."
  );
}

/* =========================================================
   PHÁT LINK ĐANG CHỌN
========================================================= */

function playCurrent() {
  const index = Number(templateSelect.value);
  playUrl(getUrl(index), index);
}

function nextLink() {
  stopVidScan();
  cancelActiveProbe();

  let index = templateSelect.selectedIndex + 1;
  if(index >= templates.length) index = 0;

  resetAutoScanIndex();
  autoScanNextIndex = index;

  templateSelect.selectedIndex = index;
  updateUrl();
  playCurrent();
}

function prevLink() {
  stopVidScan();
  cancelActiveProbe();

  let index = templateSelect.selectedIndex - 1;
  if(index < 0) index = templates.length - 1;

  resetAutoScanIndex();
  autoScanNextIndex = index;

  templateSelect.selectedIndex = index;
  updateUrl();
  playCurrent();
}

/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener("playing", function() {
  if(freem3uPlaying) {
    setVidScanStatus(
      "🟢 TÌM THẤY KÊNH " + freem3uPlayingNumber + " — đang phát.",
      "ok"
    );

    setStatus(
      "🟢 FREEM3U — Kênh số " + freem3uPlayingNumber + " đang phát",
      "ok"
    );

    updateVidResultList();
    return;
  }

  setStatus(
    "🟢 Đang phát — Link " +
    (currentPlayingLink + 1),
    "ok"
  );
});

video.addEventListener("waiting", function() {
  setStatus("⏳ Đang tải dữ liệu...");
});

video.addEventListener("error", function() {
  setStatus("🔴 Video không thể phát", "error");
});

/* =========================================================
   PHÍM TẮT
========================================================= */

document.addEventListener("keydown", function(event) {
  if(
    event.target.tagName === "INPUT" ||
    event.target.tagName === "TEXTAREA"
  ) {
    return;
  }

  if(event.key === "ArrowRight") {
    event.preventDefault();
    nextLink();
  }
  else if(event.key === "ArrowLeft") {
    event.preventDefault();
    prevLink();
  }
  else if(event.key === "ArrowDown") {
    event.preventDefault();
    nextChannel();
  }
  else if(event.key === "ArrowUp") {
    event.preventDefault();
    prevChannel();
  }
  else if(event.key === "Enter") {
    event.preventDefault();
    playCurrent();
  }
});

/* =========================================================
   BIND BUTTONS CHO iOS
========================================================= */

document.addEventListener('DOMContentLoaded', function() {
  bindIOSButton(prevChannelBtn, prevChannel);
  bindIOSButton(nextChannelBtn, nextChannel);
  bindIOSButton(autoScanBtn, autoScanLinks);
  bindIOSButton(resetAutoScanBtn, resetAutoScanIndex);
});

if (document.readyState === 'complete' || document.readyState === 'interactive') {
  bindIOSButton(prevChannelBtn, prevChannel);
  bindIOSButton(nextChannelBtn, nextChannel);
  bindIOSButton(autoScanBtn, autoScanLinks);
  bindIOSButton(resetAutoScanBtn, resetAutoScanIndex);
}

/* Khởi tạo */
document.getElementById("channelToggle")?.setAttribute("aria-expanded", "true");
document.getElementById("vidScanToggle")?.setAttribute("aria-expanded", "true");

updateVidScanDisplay(1);
updateUrl();
updateResultTable();
updateVidResultList();

console.log("✅ M3U8 Stream Discovery - Đã sẵn sàng");
console.log("📱 iOS:", isIOS());
console.log("🎬 Native HLS:", isNativeHLSSupported());
console.log("📦 HLS.js:", isHlsSupported());

</script>
