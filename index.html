<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U8 Test Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#050805;
  --panel:#0a110a;
  --panel2:#050905;
  --border:#173817;
  --text:#b7ffb7;
  --muted:#5f9b5f;
  --accent:#20e020;
  --accent2:#13b913;
  --danger:#ef4444;
  --ok:#20e020;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#030603;
  color:#b7ffb7;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:22px;
}

header{
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:23px;
  color:#45ff45;
  letter-spacing:1px;
  text-shadow:0 0 8px rgba(32,224,32,.28);
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:#081008;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
}

.player{
  background:#000;
  border-radius:11px;
  overflow:hidden;
  aspect-ratio:16/9;
}

video{
  display:block;
  width:100%;
  height:100%;
  background:#000;
}

.status{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  background:var(--panel2);
  color:var(--muted);
  font-size:13px;
}

.status.ok{color:#86efac}
.status.error{color:#fca5a5}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

select,input{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  background:#050905;
  color:var(--text);
  font-size:14px;
}
#vidCurrent{
  width:100px;
  text-align:center;
  font-weight:700;
  font-family:Consolas,monospace;
}
select:focus,input:focus{
  border-color:var(--accent);
}

.url-row{
  display:flex;
  gap:8px;
}

.url-row input{
  font-family:Consolas,monospace;
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

/* CHANNEL + nút KÊNH TRƯỚC / KÊNH SAU cùng một hàng */
.channel-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.channel-row select{
  flex:1;
  min-width:0;
}

.channel-nav{
  display:flex;
  gap:8px;
  flex:0 0 auto;
}

.channel-nav button{
  white-space:nowrap;
}

@media(max-width:600px){
  .channel-row{
    flex-wrap:wrap;
  }

  .channel-row select{
    width:100%;
    flex:0 0 100%;
  }

  .channel-nav{
    width:100%;
  }

  .channel-nav button{
    flex:1;
  }
}

/* Bố cục riêng cho các nút FREEM3U */
.vid-scan-control{
  display:flex;
  align-items:flex-end;
  gap:8px;
  margin-top:10px;
}

.vid-scan-control .vid-scan-actions{
  margin-top:0;
  flex:1;
}

.vid-scan-control .vid-scan-actions button{
  width:100%;
}

.vid-scan-number{
  flex:0 0 100px;
}

.vid-scan-number label{
  text-align:center;
}

.vid-scan-number input{
  width:100px;
  box-sizing:border-box;
}

.vid-scan-nav{
  display:flex;
  gap:8px;
  flex:1;
}

.vid-scan-nav button{
  flex:1;
}

.vid-scan-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.vid-scan-actions button{
  width:100%;
}

@media (max-width:600px){
  .vid-scan-control{
    flex-wrap:wrap;
  }

  .vid-scan-number{
    flex:0 0 100%;
  }

  .vid-scan-number input{
    display:block;
    margin:auto;
  }

  .vid-scan-nav{
    width:100%;
  }

  .vid-scan-control .vid-scan-actions{
    width:100%;
  }
}

button{
  border:1px solid #25d925;
  border-radius:7px;
  padding:10px 14px;
  background:#0b240b;
  color:#7dff7d;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
}

button:hover{
  background:#123812;
  color:#b7ffb7;
  box-shadow:0 0 8px rgba(32,224,32,.18);
}

button:disabled{
  opacity:.65;
  cursor:wait;
  box-shadow:none;
}

button.secondary{
  background:#0b1a0b;
  color:#8cff8c;
  border:1px solid #1c4d1c;
}

button.secondary:hover{
  background:#102410;
  color:#b7ffb7;
}

button.danger{
  background:var(--danger);
}

button.danger:hover{
  background:#dc2626;
}

.counter{
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
}

.quality-box{
  margin-top:10px;
  padding:10px 12px;
  border:1px solid #4a1515;
  border-radius:8px;
  background:#120707;
  color:#ff3b3b;
  font-size:13px;
  font-weight:700;
}

.quality-box span{
  color:#ff3b3b;
}

@media(max-width:760px){
  .app{padding:12px}
  .grid{grid-template-columns:1fr}
  .url-row{flex-direction:column}
  h1{font-size:22px}
}

.scan-panel{
  overflow:hidden;
}
.panel-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:0;
}
.panel-head label{
  margin:0;
}
.panel-toggle{
  padding:7px 11px;
  font-size:11px;
  text-transform:uppercase;
  white-space:nowrap;
}
.panel-body{
  margin-top:12px;
}
.panel-body.is-hidden{
  display:none;
}

</style>
</head>

<body>
<div class="app">

<header>
  <h1>⌨ M3U8 // TEST CONSOLE</h1>
  <div class="subtitle">
    [ SYSTEM READY ] Chọn kênh → chọn link → phát M3U8
  </div>
</header>

<!-- PLAYER -->
<div class="card">
  <div class="player">
    <video id="video" controls playsinline></video>
  </div>

  <div id="status" class="status">
    ⚪ Chưa phát stream
  </div>


</div>

<!-- CHỌN KÊNH / LINK -->
<div class="card scan-panel" id="channelPanel">
  <div class="panel-head">
    <label>▸ CHỌN KÊNH / LINK</label>
    <button class="secondary panel-toggle" type="button"
            onclick="togglePanel('channelBody','channelToggle')">
      <span id="channelToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="channelBody">
    <div class="grid">

      <div>
        <label>▸ NHẬP TÊN KÊNH THỦ CÔNG</label>
        <div class="url-row">
          <input id="manualChannelInput" type="text"
                 placeholder="Ví dụ: vtv1" autocomplete="off">
          <button class="secondary" onclick="useManualChannel()">DÙNG KÊNH</button>
          <button class="danger" onclick="clearManualChannel()">XÓA KÊNH</button>
        </div>

        <div class="counter">
          Kênh nhập thủ công chỉ dùng trong lần này — không lưu lại sau khi F5.
        </div>

        <div class="actions">
          <button class="danger" onclick="stopPlayer()">■ STOP</button>
          <button id="autoScanBtn" onclick="autoScanLinks()">⚡ DÒ TỰ ĐỘNG</button>
          <button class="secondary" onclick="resetAutoScan()">↻ DÒ LẠI TỪ ĐẦU</button>
        </div>

        <label style="margin-top:12px">▸ CHANNEL</label>
        <div class="channel-row">
          <select id="channelSelect"></select>
          <div class="channel-nav">
            <button class="secondary" onclick="prevChannel()">⬅ KÊNH TRƯỚC</button>
            <button class="secondary" onclick="nextChannel()">KÊNH SAU ➡</button>
          </div>
        </div>

        <div id="channelCounter" class="counter"></div>
      </div>

      <div>
        <label>▸ STREAM SOURCE</label>
        <select id="templateSelect"></select>
        <div id="linkCounter" class="counter"></div>
      </div>

    </div>
  </div>
</div>

<!-- DÒ KÊNH FREEM3U -->
<div class="card scan-panel" id="vidScanPanel">
  <div class="panel-head">
    <label>▸ FREEM3U // DÒ KÊNH THEO SỐ</label>
    <button class="secondary panel-toggle" type="button" onclick="togglePanel('vidScanBody','vidScanToggle')">
      <span id="vidScanToggle">▲ ẨN</span>
    </button>
  </div>

 

  <div class="vid-scan-control">
    <div class="vid-scan-number">
      <label>SỐ ĐANG DÒ</label>
      <input id="vidCurrent" value="1" readonly>
    </div>

    <div class="vid-scan-nav">
      <button class="secondary" onclick="scanBackward()">◀️ DÒ LÙI</button>
      <button id="vidScanBtn" onclick="startVidScan()">🔎 DÒ TỚI</button>
    </div>

    <div class="vid-scan-actions">
      <button class="secondary" onclick="resetVidScan()">↺ DÒ LẠI TỪ ĐẦU</button>
    </div>
  </div>

  <div id="vidScanStatus" class="counter">
    ⚪ Sẵn sàng
  </div>
  </div>
</div>

<!-- URL -->
<div class="card">
  <label>▸ STREAM URL</label>

  <div class="url-row">
    <input id="urlBox" readonly>
    <button onclick="copyUrl()">COPY</button>
  </div>

  <div id="qualityBox" class="quality-box">
    📺 CHẤT LƯỢNG: <span id="qualityText">Chưa dò kênh</span>
  </div>
</div>

</div>

<script>
/* =========================================================
   DANH SÁCH KÊNH

========================================================= */

const channels = [
  "antv",
  "anninhtv",
  "ANNINHTV",
  "film360",
  "nghean",
  "nghe-an",
  "nghean01",
  "laichau",
  "laichautv",

  "bacninh01"
];

/* =========================================================

   {code} sẽ được thay bằng mã kênh.
========================================================= */

  {

  },

  {

    url:"https://live.fptplay53.net/fnxhd1/{code}_vhls.smil/chunklist_b2500000.m3u8"
  },

  {

    url:"https://live.fptplay53.net/fnxhd2/{code}_vhls.smil/chunklist_b2500000.m3u8"
  },

  {
    name:"Link 26 — FNX HD1",
    url:"https://live.fptplay53.net/fnxhd1/{code}_hls.smil/chunklist.m3u8"
  },

  {
    name:"Link 27 — FNX HD2",
    url:"https://live.fptplay53.net/fnxhd2/{code}_hls.smil/chunklist.m3u8"
  },

  {
    name:"Link 28 — FNX HD1 5M",
    url:"https://live.fptplay53.net/fnxhd1/{code}_vhls.smil/chunklist_b5000000.m3u8"
  },

  {
    name:"Link 29 — FNX HD2 5M",
    url:"https://live.fptplay53.net/fnxhd2/{code}_vhls.smil/chunklist_b5000000.m3u8"
  }

];

/* =========================================================
   BIẾN
========================================================= */

let hls = null;
let currentPlayingLink = 0;
let autoScanning = false;
let autoScanToken = 0;
let autoScanNextIndex = 0;

/* FREEM3U numeric scanner */
let vidScanning = false;
let vidScanToken = 0;
let vidScanNumber = 1;
let freem3uPlaying = false;
let freem3uPlayingNumber = null;
let vidFoundNumbers = [];
const VID_SCAN_MAX = 999;
const VID_SCAN_TIMEOUT = 6000;

const video = document.getElementById("video");
const channelSelect = document.getElementById("channelSelect");
const templateSelect = document.getElementById("templateSelect");
const urlBox = document.getElementById("urlBox");
const statusBox = document.getElementById("status");
const channelCounter = document.getElementById("channelCounter");
const linkCounter = document.getElementById("linkCounter");
const qualityText = document.getElementById("qualityText");

const vidCurrent = document.getElementById("vidCurrent");
const vidFound = document.getElementById("vidFound");
const vidScanStatus = document.getElementById("vidScanStatus");
const vidScanBtn = document.getElementById("vidScanBtn");

/* =========================================================
   KHỞI TẠO DROPDOWN
========================================================= */

channels.forEach(code => {
  const option = document.createElement("option");
  option.value = code;
  option.textContent = code;
  channelSelect.appendChild(option);
});

templates.forEach((template,index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = template.name;
  templateSelect.appendChild(option);
});

/* Mặc định */
channelSelect.value = "nghean01";
templateSelect.value = "0";

/* =========================================================
   KÊNH NHẬP THỦ CÔNG
   Không dùng localStorage/sessionStorage:
   - Chỉ có hiệu lực trong lần sử dụng hiện tại.
   - F5 tải lại trang sẽ mất tên kênh thủ công.
========================================================= */

let manualChannelCode = "";

function getActiveChannelCode() {
  return manualChannelCode.trim() || channelSelect.value;
}

function resetAutoScanState() {
  autoScanToken++;
  autoScanning = false;
  autoScanNextIndex = 0;
  setAutoScanButton(false);
}

function useManualChannel() {
  stopVidScan();
  const input = document.getElementById("manualChannelInput");
  const code = input.value.trim();

  if(!code) {
    manualChannelCode = "";
    updateUrl();
    setStatus("⚪ Chưa nhập tên kênh thủ công");
    return;
  }

  manualChannelCode = code;

  // Nhập kênh mới -> reset dò về Link 1.
  resetAutoScanState();

  templateSelect.selectedIndex = 0;
  updateUrl();
  playCurrent();
}

function clearManualChannel() {
  stopVidScan();
  manualChannelCode = "";

  const input = document.getElementById("manualChannelInput");
  if(input) input.value = "";

  // Quay lại kênh đang được chọn trong danh sách.
  resetAutoScanState();

  updateUrl();
  playCurrent();

  setStatus(
    "🟢 Đã xóa kênh nhập tay — đang dùng kênh trong danh sách",
    "ok"
  );
}

document.getElementById("manualChannelInput").addEventListener(
  "keydown",
  function(event) {
    if(event.key === "Enter") {
      event.preventDefault();
      useManualChannel();
    }
  }
);

function getUrl(index = Number(templateSelect.value)) {

  return templates[index].url.replaceAll(
    "{code}",
    getActiveChannelCode()
  );

}

/* =========================================================
   CẬP NHẬT GIAO DIỆN
========================================================= */

function getQualityLabel(index) {
  const name = templates[index]?.name || "";

  if(/5\.6M/i.test(name)) return "🔥 5.6 Mbps — RẤT CAO";
  if(/5M/i.test(name)) return "🔥 5 Mbps — CAO";
  if(/4M/i.test(name)) return "🟢 4 Mbps — CAO";
  if(/2\.5M/i.test(name)) return "🟡 2.5 Mbps — KHÁ";
  if(/HD/i.test(name)) return "📺 HD — KHÁ/CAO";
  if(/SD/i.test(name)) return "📺 SD — TRUNG BÌNH";
  if(/INDEX/i.test(name)) return "📡 HLS INDEX — TỰ CHỌN";
  return "📺 Chưa xác định bitrate";
}

function showQuality(index, detected=false) {
  if(!qualityText) return;

  // Chỉ hiện chất lượng khi link đã dò/phát thành công.
  if(!detected) {
    qualityText.textContent = "";
    return;
  }

  const label = getQualityLabel(index);
  qualityText.textContent = label;
}

function updateUrl() {

  urlBox.value = getUrl();

  channelCounter.textContent =
    "Kênh " +
    (channelSelect.selectedIndex + 1) +
    "/" +
    channels.length;

  linkCounter.textContent =
    "Link " +
    (templateSelect.selectedIndex + 1) +
    "/" +
    templates.length;



  showQuality(templateSelect.selectedIndex, false);
}

/* =========================================================
   CHUYỂN KÊNH
========================================================= */

function nextChannel() {

  
  // Đổi kênh -> reset dò về Link 1.
  resetAutoScanState();

let index = channelSelect.selectedIndex + 1;

  if(index >= channels.length) {
    index = 0;
  }

  channelSelect.selectedIndex = index;

  // Đổi kênh -> luôn quay về Link 1 và reset dò.
  templateSelect.selectedIndex = 0;
  updateUrl();
  playCurrent();

}

function prevChannel() {

  
  // Đổi kênh -> reset dò về Link 1.
  resetAutoScanState();

let index = channelSelect.selectedIndex - 1;

  if(index < 0) {
    index = channels.length - 1;
  }

  channelSelect.selectedIndex = index;

  // Đổi kênh -> luôn quay về Link 1 và reset dò.
  templateSelect.selectedIndex = 0;
  updateUrl();
  playCurrent();

}

/* =========================================================
   CHUYỂN LINK
========================================================= */

/* =========================================================
   EVENT DROPDOWN
========================================================= */

channelSelect.addEventListener(
  "change",
  function(){
    stopVidScan();
    // Chọn kênh có sẵn -> thoát chế độ kênh thủ công.
    manualChannelCode = "";
    const manualInput = document.getElementById("manualChannelInput");
    if(manualInput) manualInput.value = "";

    // Đổi kênh -> lần dò mới luôn bắt đầu từ Link 1.
    autoScanToken++;
    autoScanning = false;
    autoScanNextIndex = 0;
    setAutoScanButton(false);

    // Chọn kênh khác -> quay về Link 1.
    templateSelect.selectedIndex = 0;
    updateUrl();
    playCurrent();
  }
);

templateSelect.addEventListener(
  "change",
  function(){
    stopVidScan();
    updateUrl();
    playCurrent();
  }
);

/* =========================================================
   ẨN / HIỆN CÁC BẢNG DÒ
========================================================= */

function togglePanel(bodyId, toggleId) {
  const body = document.getElementById(bodyId);
  const toggle = document.getElementById(toggleId);

  if(!body || !toggle) return;

  const hidden = body.classList.toggle("is-hidden");
  toggle.textContent = hidden ? "▼ HIỆN" : "▲ ẨN";
}

/* =========================================================
   TRẠNG THÁI
========================================================= */

function setStatus(text,type="") {

  statusBox.textContent = text;
  statusBox.className = "status " + type;

}

/* =========================================================
   HỦY PLAYER CŨ
========================================================= */

function destroyPlayer() {

  if(hls) {
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

}

/* =========================================================
   PHÁT URL
========================================================= */

function isIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

/* =========================================================
   PHÁT URL
   iOS/iPadOS: ưu tiên HLS native của Safari.
   PC/Android: dùng hls.js khi có MSE.
========================================================= */

function setupHlsPlayback(url, {
  onPlaying,
  onError,
  timeout = 10000
} = {}) {
  let finished = false;
  let timer = null;

  const cleanup = () => {
    clearTimeout(timer);

    if (onPlaying) {
      video.removeEventListener("playing", onPlaying);
    }
    if (onError) {
      video.removeEventListener("error", onError);
    }

    if (hls && window.Hls) {
      hls.off(Hls.Events.MANIFEST_PARSED, onManifestParsed);
      hls.off(Hls.Events.ERROR, onHlsError);
    }
  };

  const finish = (success) => {
    if (finished) return;
    finished = true;
    cleanup();

    if (success) {
      if (onPlaying) onPlaying();
    } else if (onError) {
      onError();
    }
  };

  const onManifestParsed = () => {
    video.play().catch(() => {});
  };

  const onHlsError = (event, data) => {
    if (data && data.fatal) finish(false);
  };

  const onVideoPlaying = () => finish(true);
  const onVideoError = () => finish(false);

  if (onPlaying) {
    video.addEventListener("playing", onVideoPlaying, {once:true});
  }
  if (onError) {
    video.addEventListener("error", onVideoError, {once:true});
  }

  // iOS/iPadOS: native HLS trước.
  if (
    isIOS() &&
    video.canPlayType("application/vnd.apple.mpegurl")
  ) {
    video.addEventListener(
      "loadedmetadata",
      () => video.play().catch(() => {}),
      {once:true}
    );
    video.src = url;
  }
  // PC/Android/macOS: hls.js khi MSE được hỗ trợ.
  else if (window.Hls && Hls.isSupported()) {
    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:30
    });

    hls.on(Hls.Events.MANIFEST_PARSED, onManifestParsed);
    hls.on(Hls.Events.ERROR, onHlsError);

    hls.loadSource(url);
    hls.attachMedia(video);
  }
  // Native HLS fallback.
  else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.addEventListener(
      "loadedmetadata",
      () => video.play().catch(() => {}),
      {once:true}
    );
    video.src = url;
  }
  else {
    finish(false);
    return;
  }

  timer = setTimeout(() => finish(false), timeout);

  return {
    cancel: () => finish(false)
  };
}

function playUrl(url,index) {
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  destroyPlayer();

  currentPlayingLink = index;

  setStatus(
    "⏳ Đang kết nối Link " +
    (index + 1) +
    "..."
  );

  setupHlsPlayback(url, {
    onPlaying: () => {
      setStatus(
        "🟢 Đang phát — Link " +
        (index + 1),
        "ok"
      );
    },
    onError: () => {
      setStatus(
        "🔴 Không phát được Link " +
        (index + 1),
        "error"
      );
    }
  });
}

/* =========================================================
   DÒ LINK TỰ ĐỘNG
   - Luôn dò từ Link 1 → Link cuối
   - Mỗi link chỉ thử đúng 1 lần
   - Link nào phát được thì dừng ngay
   - Dò hết mà không có link nào thì dừng
========================================================= */

function setAutoScanButton(scanning) {
  const btn = document.getElementById("autoScanBtn");
  if(!btn) return;

  btn.disabled = scanning;
  btn.textContent = scanning
    ? "⏳ ĐANG DÒ..."
    : "⚡ DÒ TỰ ĐỘNG";
}


function tryAutoScanLink(index, token) {
  return new Promise((resolve) => {
    if (token !== autoScanToken) {
      resolve(false);
      return;
    }

    const url = getUrl(index);

    destroyPlayer();
    currentPlayingLink = index;
    templateSelect.selectedIndex = index;
    updateUrl();

    setStatus(
      "🔎 Đang dò Link " + (index + 1) + "/" + templates.length + "..."
    );

    setupHlsPlayback(url, {
      timeout: 10000,
      onPlaying: () => resolve(true),
      onError: () => resolve(false)
    });
  });
}

function autoScanLinks() {
  if(autoScanning) return;

  // Dò tiếp từ vị trí còn lại.
  // Ví dụ lần trước tìm thấy Link 6 -> lần bấm sau bắt đầu từ Link 7.
  if(autoScanNextIndex >= templates.length) {
    setStatus(
      "⚪ Đã dò hết tất cả " + templates.length + " link — không còn link để dò",
      "error"
    );
    return;
  }

  autoScanning = true;
  autoScanToken++;

  const token = autoScanToken;
  let index = autoScanNextIndex;

  setAutoScanButton(true);

  function scanNext() {
    if(token !== autoScanToken || !autoScanning) return;

    if(index >= templates.length) {
      autoScanNextIndex = templates.length;
      autoScanning = false;
      destroyPlayer();
      setAutoScanButton(false);

      setStatus(
        "🔴 Đã dò hết " + templates.length + " link — không có thêm link nào phát được",
        "error"
      );
      return;
    }

    const testIndex = index++;

    // Lưu ngay vị trí kế tiếp để lần bấm sau tiếp tục từ đây.
    autoScanNextIndex = index;

    tryAutoScanLink(testIndex, token).then(function(success) {
      if(token !== autoScanToken || !autoScanning) return;

      if(success) {
        autoScanning = false;
        templateSelect.selectedIndex = testIndex;
        updateUrl();
        showQuality(testIndex, true);
        setAutoScanButton(false);

        setStatus(
          "🟢 Tìm thấy link phát được — Link " + (testIndex + 1) +
          " | Lần dò sau sẽ bắt đầu từ Link " + (testIndex + 2 > templates.length ? "cuối" : testIndex + 2),
          "ok"
        );
        return;
      }

      // Không phát được -> tiếp tục link kế tiếp ở task mới.
      setTimeout(scanNext, 0);
    }).catch(function(error) {
      console.log("Auto scan:", error);

      if(token !== autoScanToken || !autoScanning) return;

      setTimeout(scanNext, 0);
    });
  }

  setTimeout(scanNext, 0);
}

/* =========================================================
   DÒ LẠI TỪ ĐẦU
   Reset con trỏ dò về Link 1.
========================================================= */

function resetAutoScan() {
  autoScanToken++;
  autoScanning = false;
  autoScanNextIndex = 0;

  setAutoScanButton(false);

  templateSelect.selectedIndex = 0;
  updateUrl();

  destroyPlayer();

  setStatus(
    "🔄 Đã reset dò — lần dò tiếp theo bắt đầu từ Link 1",
    "ok"
  );
}

/* =========================================================
   FREEM3U // DÒ KÊNH THEO SỐ
   URL cố định:
   https://freem3u.xyz/api/live/play.m3u8?vid={number}

   Dò tuần tự 1 -> 999.
   Số nào phát được thật sự thì dừng và hiện số kênh đó.
========================================================= */

function getVidUrl(number) {
  return "https://freem3u.xyz/api/live/play.m3u8?vid=" + number;
}

function setVidScanButton(scanning) {
  if(!vidScanBtn) return;

  vidScanBtn.disabled = scanning;
  vidScanBtn.textContent = scanning
    ? "⏳ ĐANG DÒ SỐ..."
    : "⚡ DÒ SỐ TỰ ĐỘNG";
}

function updateVidScanDisplay(number) {
  vidScanNumber = number;
  if(vidCurrent) vidCurrent.value = number;
}

function setVidScanStatus(text, type="") {
  if(!vidScanStatus) return;

  vidScanStatus.textContent = text;
  vidScanStatus.style.color =
    type === "ok" ? "#86efac" :
    type === "error" ? "#fca5a5" :
    "";
}

function tryVidNumber(number, token) {
  return new Promise((resolve) => {
    if (token !== vidScanToken || !vidScanning) {
      resolve(false);
      return;
    }

    const url = getVidUrl(number);

    destroyPlayer();

    setupHlsPlayback(url, {
      timeout: VID_SCAN_TIMEOUT,
      onPlaying: () => resolve(true),
      onError: () => resolve(false)
    });
  });
}

function startVidScan() {
  if(vidScanning) return;

  if(vidScanNumber > VID_SCAN_MAX) {
    setVidScanStatus(
      "🟢 Đã dò hết số 1 → " + VID_SCAN_MAX +
      (vidFoundNumbers.length
        ? " | Tìm thấy: " + vidFoundNumbers.join(", ")
        : " | Không tìm thấy kênh.")
    );
    return;
  }

  // Nếu bắt đầu từ số 1 thì đây là một lượt dò mới.
  if(vidScanNumber === 1) {
    vidFoundNumbers = [];
    if(vidFound && vidFoundNumbers.length === 0) {
    vidFound.value = "Đang dò...";
  }
  }

  vidScanning = true;
  vidScanToken++;

  const token = vidScanToken;
  setVidScanButton(true);

  if(vidFound) vidFound.value = vidFoundNumbers.length ? vidFoundNumbers.join(", ") : "Đang dò...";

  function scanNext() {
    if(token !== vidScanToken || !vidScanning) return;

    if(vidScanNumber > VID_SCAN_MAX) {
      vidScanning = false;
      setVidScanButton(false);
      setVidScanStatus(
        vidFoundNumbers.length
          ? "🟢 Đã dò hết 1 → " + VID_SCAN_MAX +
            " | Tìm thấy: " + vidFoundNumbers.join(", ")
          : "🔴 Đã dò hết số 1 → " + VID_SCAN_MAX + " mà chưa tìm thấy kênh.",
        vidFoundNumbers.length ? "ok" : "error"
      );
      return;
    }

    const number = vidScanNumber;
    updateVidScanDisplay(number);

    setVidScanStatus(
      "🔎 Đang dò kênh số " + number + "/" + VID_SCAN_MAX + "..."
    );

    tryVidNumber(number, token).then((success) => {
      if(token !== vidScanToken || !vidScanning) return;

      if(success) {
        // Tìm thấy tín hiệu: dừng NGAY tại số này để người dùng xem.
        vidFoundNumbers.push(number);
        updateVidScanDisplay(number);

        if(vidFound) {
          vidFound.value = vidFoundNumbers.join(", ");
        }

        urlBox.value = getVidUrl(number);
        freem3uPlaying = true;
        freem3uPlayingNumber = number;

        // Đã tìm thấy: dừng lượt hiện tại nhưng nhớ số kế tiếp.
        // Lần bấm DÒ SỐ TỰ ĐỘNG tiếp theo sẽ dò từ số này.
        vidScanNumber = number + 1;
        vidScanning = false;
        if(vidScanBtn) vidScanBtn.disabled = false;

        setVidScanStatus(
          "🎯 TÌM THẤY TÍN HIỆU Ở KÊNH #" + number +
          " — ĐÃ DỪNG. Bấm DÒ SỐ TỰ ĐỘNG để dò tiếp từ #" +
          vidScanNumber + ".",
          "ok"
        );

        setStatus(
          "🟢 FREEM3U — Tìm thấy kênh " + number +
          " — đã dừng dò để bạn xem."
        );

        return;
      }

      // Không có -> tự tăng số và dò tiếp.
      vidScanNumber = number + 1;
      setTimeout(scanNext, 0);

    }).catch((error) => {
      console.log("FreeM3U scan:", error);

      if(token !== vidScanToken || !vidScanning) return;

      vidScanNumber = number + 1;
      setTimeout(scanNext, 0);
    });
  }

  setTimeout(scanNext, 0);
}


function scanBackward() {
  if(vidScanning) return;

  // DÒ LÙI phải căn cứ đúng vào "SỐ ĐANG DÒ" đang hiển thị.
  // Ví dụ đang ở #50 thì bấm DÒ LÙI sẽ dò #49, #48, #47...
  const current = Number(
    vidCurrent ? vidCurrent.value : vidScanNumber
  );

  if(!Number.isFinite(current)) {
    setVidScanStatus("⚪ Không xác định được số hiện tại để dò lùi.", "error");
    return;
  }

  const start = current - 1;

  if(start < 1) {
    setVidScanStatus("⚪ Đang ở số 1 — không còn số nhỏ hơn để dò lùi.");
    return;
  }

  vidScanNumber = start;
  startVidScan();
}

function stopVidScan() {
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  setVidScanButton(false);

  destroyPlayer();

  setVidScanStatus(
    "⚪ Đã dừng dò tại số " + vidScanNumber + ". Bấm DÒ SỐ TỰ ĐỘNG để tiếp tục."
  );
}

function resetVidScan() {
  vidScanToken++;
  vidScanning = false;
  freem3uPlaying = false;
  freem3uPlayingNumber = null;
  vidScanNumber = 1;
  vidFoundNumbers = [];

  setVidScanButton(false);
  updateVidScanDisplay(1);

  if(vidFound) vidFound.value = "Chưa dò";

  setVidScanStatus(
    "🔄 Đã reset — lần dò tiếp theo bắt đầu từ kênh số 1."
  );
}

/* =========================================================
   PHÁT LINK ĐANG CHỌN
========================================================= */

function playCurrent() {

  const index = Number(
    templateSelect.value
  );

  playUrl(
    getUrl(index),
    index
  );

}

function nextLink() {
  stopVidScan();

  let index = templateSelect.selectedIndex + 1;
  if(index >= templates.length) index = 0;

  autoScanToken++;
  autoScanning = false;
  autoScanNextIndex = index;

  templateSelect.selectedIndex = index;
  updateUrl();
  playCurrent();
}

function prevLink() {
  stopVidScan();

  let index = templateSelect.selectedIndex - 1;
  if(index < 0) index = templates.length - 1;

  autoScanToken++;
  autoScanning = false;
  autoScanNextIndex = index;

  templateSelect.selectedIndex = index;
  updateUrl();
  playCurrent();
}

/* =========================================================
   DỪNG
========================================================= */

function stopPlayer() {

  autoScanToken++;
  autoScanning = false;
  setAutoScanButton(false);

  vidScanToken++;
  vidScanning = false;
  setVidScanButton(false);

  destroyPlayer();

  setStatus(
    "⚪ Đã dừng"
  );
}

/* =========================================================
   COPY URL
========================================================= */

async function copyUrl() {

  const url = urlBox.value;

  try {

    await navigator.clipboard.writeText(url);

    setStatus(
      "📋 Đã copy link",
      "ok"
    );

  }

  catch(error) {

    urlBox.select();
    document.execCommand("copy");

    setStatus(
      "📋 Đã copy link",
      "ok"
    );

  }

}

/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "playing",
  function() {

    if(freem3uPlaying) {
      if(vidFound && freem3uPlayingNumber !== null) {
        vidFound.value = "KÊNH " + freem3uPlayingNumber;
      }

      if(qualityText && freem3uPlayingNumber !== null) {
        qualityText.textContent =
          "FreeM3U — Kênh số " + freem3uPlayingNumber;
      }

      setVidScanStatus(
        "🟢 TÌM THẤY KÊNH " + freem3uPlayingNumber + " — đang phát.",
        "ok"
      );

      setStatus(
        "🟢 FREEM3U — Kênh số " + freem3uPlayingNumber + " đang phát",
        "ok"
      );

      return;
    }

    showQuality(currentPlayingLink, true);

    setStatus(
      "🟢 Đang phát — Link " +
      (currentPlayingLink + 1),
      "ok"
    );
  }
);

video.addEventListener(
  "waiting",
  function() {

    setStatus(
      "⏳ Đang tải dữ liệu..."
    );

  }
);

video.addEventListener(
  "error",
  function() {

    setStatus(
      "🔴 Video không thể phát",
      "error"
    );

  }
);

/* =========================================================
   PHÍM TẮT
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    /*
      Không kích hoạt phím tắt khi đang nhập
    */

    if(
      event.target.tagName === "INPUT" ||
      event.target.tagName === "TEXTAREA"
    ) {
      return;
    }

    if(event.key === "ArrowRight") {
      nextLink();
    }

    else if(event.key === "ArrowLeft") {
      prevLink();
    }

    else if(event.key === "ArrowDown") {
      nextChannel();
    }

    else if(event.key === "ArrowUp") {
      prevChannel();
    }

    else if(event.key === "Enter") {
      playCurrent();
    }

  }
);

/* Khởi tạo FREEM3U scanner */
updateVidScanDisplay(1);

/* Khởi tạo URL */
updateUrl();

</script>
