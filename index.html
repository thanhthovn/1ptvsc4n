<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3U8 Test Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#050805;
  --panel:#0a110a;
  --panel2:#050905;
  --border:#173817;
  --text:#b7ffb7;
  --muted:#5f9b5f;
  --accent:#20e020;
  --accent2:#13b913;
  --danger:#ef4444;
  --ok:#20e020;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#030603;
  color:#b7ffb7;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:22px;
}

header{
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:23px;
  color:#45ff45;
  letter-spacing:1px;
  text-shadow:0 0 8px rgba(32,224,32,.28);
}

.subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

.card{
  background:#081008;
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:14px;
}

.player{
  background:#000;
  border-radius:11px;
  overflow:hidden;
  aspect-ratio:16/9;
}

video{
  display:block;
  width:100%;
  height:100%;
  background:#000;
}

.status{
  margin-top:12px;
  padding:10px 12px;
  border-radius:8px;
  background:var(--panel2);
  color:var(--muted);
  font-size:13px;
}

.status.ok{color:#86efac}
.status.error{color:#fca5a5}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

label{
  display:block;
  margin-bottom:7px;
  color:var(--muted);
  font-size:13px;
  font-weight:700;
}

select,input{
  width:100%;
  padding:11px;
  border:1px solid var(--border);
  border-radius:8px;
  outline:none;
  background:#050905;
  color:var(--text);
  font-size:14px;
}

select:focus,input:focus{
  border-color:var(--accent);
}

.url-row{
  display:flex;
  gap:8px;
}

.url-row input{
  font-family:Consolas,monospace;
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

button{
  border:1px solid #25d925;
  border-radius:7px;
  padding:10px 14px;
  background:#0b240b;
  color:#7dff7d;
  font-weight:700;
  cursor:pointer;
  text-transform:uppercase;
}

button:hover{
  background:#123812;
  color:#b7ffb7;
  box-shadow:0 0 8px rgba(32,224,32,.18);
}

button.secondary{
  background:#0b1a0b;
  color:#8cff8c;
  border:1px solid #1c4d1c;
}

button.secondary:hover{
  background:#102410;
  color:#b7ffb7;
}

button.danger{
  background:#7f1515;
}

button.danger:hover{
  background:#a51d1d;
}

button.copy-btn{
  background:#8b1717;
  border-color:#ef4444;
  color:#ffd0d0;
}

button.copy-btn:hover{
  background:#b91c1c;
  border-color:#ff5555;
  color:#fff;
  box-shadow:0 0 10px rgba(239,68,68,.25);
}

.counter{
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
}

@media(max-width:760px){
  .app{padding:12px}
  .grid{grid-template-columns:1fr}
  .url-row{flex-direction:column}
  h1{font-size:22px}
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>⌨ M3U8 // TEST CONSOLE</h1>
  <div class="subtitle">
    [ SYSTEM READY ] Chọn kênh → chọn link → phát M3U8
  </div>
</header>

<!-- PLAYER -->
<div class="card">
  <div class="player">
    <video id="video" controls playsinline webkit-playsinline preload="metadata"></video>
  </div>

  <div id="status" class="status">
    ⚪ Chưa phát stream
  </div>

  <div class="actions">
    <button onclick="playCurrent()">▶ RUN</button>
    <button class="danger" onclick="stopPlayer()">■ STOP</button>
  </div>
</div>

<!-- CHỌN KÊNH / LINK -->
<div class="card">
  <div class="grid">

    <div>
      <label>▸ CHANNEL</label>
      <select id="channelSelect"></select>

      <div class="actions">
        <button class="secondary" onclick="prevChannel()">⬅ KÊNH TRƯỚC</button>
        <button class="secondary" onclick="nextChannel()">KÊNH SAU ➡</button>
      </div>

      <div id="channelCounter" class="counter"></div>
    </div>

    <div>
      <label>▸ STREAM SOURCE</label>
      <select id="templateSelect"></select>

      <div class="actions">
        <button class="secondary" onclick="prevLink()">⬅ LINK TRƯỚC</button>
        <button class="secondary" onclick="nextLink()">LINK SAU ➡</button>
      </div>

      <div id="linkCounter" class="counter"></div>
    </div>

  </div>
</div>

<!-- URL -->
<div class="card">
  <label>▸ STREAM URL</label>

  <div class="url-row">
    <input id="urlBox" readonly>
    <button class="copy-btn" onclick="copyUrl()">COPY</button>
  </div>
</div>

</div>

<script>
/* =========================================================
   DANH SÁCH KÊNH
   Chỉ cần thêm mã vào đây khi muốn thêm kênh.
========================================================= */

const channels = [
  
  "vtv1",
  "antv",
  "anninhtv",
  "ANNINHTV",
  "film360",
  "nghean",
  "nghe-an",
  "nghean01",
  "laichau",
  "laichautv",
  "laichau01",
  "bacninh01"
];


/* =========================================================
   CÁC MẪU LINK {code} sẽ được thay bằng mã kênh.
========================================================= */

const templates = [

  {
    name:"Link 1 — Live247 AVC 4M",
    url:"https://live-a.fptplay53.net/live/media/{code}/live247-hls-avc/{code}-avc1_4000000=10000-mp4a_131600=20000.m3u8"
  },

  {
    name:"Link 2 — Live247 AVC 5.6M",
    url:"https://live-a.fptplay53.net/live/media/{code}/live247-hls-avc/{code}-avc1_5600000=10000-mp4a_131600=20000.m3u8"
  },

  {
    name:"Link 3 — Live HLS AVC 4M",
    url:"https://vips-livecdn.fptplay.net/live/media/{code}/live-hls-avc/{code}-avc1_4000000=10000-mp4a_131600=20000.m3u8"
  },

  {
    name:"Link 4 — Live HLS AVC INDEX",
    url:"https://vips-livecdn.fptplay.net/live/media/{code}/live-hls-avc/index.m3u8"
  },

  {
    name:"Link 5 — EPZ SD1",
    url:"https://live.fptplay53.net/epzsd1/{code}_hls.smil/chunklist.m3u8"
  },

 {
    name:"Link 6 — EPZ SD2",
    url:"https://live.fptplay53.net/epzsd2/{code}_hls.smil/chunklist.m3u8"
  },
{
    name:"Link 7 — EPZ HD1-5M",
    url:"https://live.fptplay53.net/epzhd1/{code}_vhls.smil/chunklist_b5000000.m3u8"
  },
  {
    name:"Link 7 — EPZ HD1-5M",
    url:"https://live.fptplay53.net/epzhd2/{code}_vhls.smil/chunklist_b5000000.m3u8"
  },

  {
    name:"Link 8 — FNX SD1 - 2.5M",
    url:"https://live.fptplay53.net/fnxsd1/{code}_hls.smil/chunklist_b2500000.m3u8"
  },
 {
    name:"Link 8 — FNX SD2 - 2.5M",
    url:"https://live.fptplay53.net/fnxsd2/{code}_hls.smil/chunklist_b2500000.m3u8"
  },
  {
    name:"Link 8 — FNX HD 5M",
    url:"https://live.fptplay53.net/fnxhd2/{code}_vhls.smil/chunklist_b5000000.m3u8"
  },

  {
    name:"Link 9 — FNX HD 1",
    url:"https://live.fptplay53.net/fnxhd1/{code}_hls.smil/chunklist.m3u8"
  }

];


/* =========================================================
   BIẾN
========================================================= */

let hls = null;
let currentPlayingLink = 0;

const video = document.getElementById("video");
const channelSelect = document.getElementById("channelSelect");
const templateSelect = document.getElementById("templateSelect");
const urlBox = document.getElementById("urlBox");
const statusBox = document.getElementById("status");
const channelCounter = document.getElementById("channelCounter");
const linkCounter = document.getElementById("linkCounter");


/* =========================================================
   KHỞI TẠO DROPDOWN
========================================================= */

channels.forEach(code => {
  const option = document.createElement("option");
  option.value = code;
  option.textContent = code;
  channelSelect.appendChild(option);
});

templates.forEach((template,index) => {
  const option = document.createElement("option");
  option.value = index;
  option.textContent = template.name;
  templateSelect.appendChild(option);
});


/* Mặc định */
channelSelect.value = "nghean01";
templateSelect.value = "0";


/* =========================================================
   TẠO URL
========================================================= */

function getUrl(index = Number(templateSelect.value)) {

  return templates[index].url.replaceAll(
    "{code}",
    channelSelect.value
  );

}


/* =========================================================
   CẬP NHẬT GIAO DIỆN
========================================================= */

function updateUrl() {

  urlBox.value = getUrl();

  channelCounter.textContent =
    "Kênh " +
    (channelSelect.selectedIndex + 1) +
    "/" +
    channels.length;

  linkCounter.textContent =
    "Link " +
    (templateSelect.selectedIndex + 1) +
    "/" +
    templates.length;

}


/* =========================================================
   CHUYỂN KÊNH
========================================================= */

function nextChannel() {

  let index = channelSelect.selectedIndex + 1;

  if(index >= channels.length) {
    index = 0;
  }

  channelSelect.selectedIndex = index;

  updateUrl();
  playCurrent();

}


function prevChannel() {

  let index = channelSelect.selectedIndex - 1;

  if(index < 0) {
    index = channels.length - 1;
  }

  channelSelect.selectedIndex = index;

  updateUrl();
  playCurrent();

}


/* =========================================================
   CHUYỂN LINK
========================================================= */

function nextLink() {

  let index = templateSelect.selectedIndex + 1;

  if(index >= templates.length) {
    index = 0;
  }

  templateSelect.selectedIndex = index;

  updateUrl();
  playCurrent();

}


function prevLink() {

  let index = templateSelect.selectedIndex - 1;

  if(index < 0) {
    index = templates.length - 1;
  }

  templateSelect.selectedIndex = index;

  updateUrl();
  playCurrent();

}


/* =========================================================
   EVENT DROPDOWN
========================================================= */

channelSelect.addEventListener(
  "change",
  function(){
    updateUrl();
    playCurrent();
  }
);

templateSelect.addEventListener(
  "change",
  function(){
    updateUrl();
    playCurrent();
  }
);


/* =========================================================
   TRẠNG THÁI
========================================================= */

function setStatus(text,type="") {

  statusBox.textContent = text;
  statusBox.className = "status " + type;

}


/* =========================================================
   HỦY PLAYER CŨ
========================================================= */

function destroyPlayer() {

  if(hls) {
    hls.destroy();
    hls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

}


/* =========================================================
   PHÁT URL
========================================================= */

function playUrl(url,index) {

  destroyPlayer();

  currentPlayingLink = index;

  setStatus(
    "⏳ Đang kết nối Link " +
    (index + 1) +
    "..."
  );


  /*
    Safari / iOS: ưu tiên HLS native.
    iPhone/iPad có HLS tích hợp sẵn và thường ổn định hơn hls.js.
  */
  const isApple = /iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent) ||
                  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if(isApple && video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = url;

    video.addEventListener(
      "loadedmetadata",
      function() {
        setStatus(
          "🟢 Đang phát — Link " + (index + 1),
          "ok"
        );

        video.play().catch(() => {
          setStatus(
            "🟡 Đã tải stream — bấm ▶ trên video để phát",
            "ok"
          );
        });
      },
      {once:true}
    );

  }

  /*
    Chrome / Edge / Firefox
    sử dụng HLS.js
  */

  else if(window.Hls && Hls.isSupported()) {

    hls = new Hls({
      enableWorker:true,
      lowLatencyMode:true,
      backBufferLength:30
    });


    hls.loadSource(url);
    hls.attachMedia(video);


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function() {

        setStatus(
          "🟢 Đang phát — Link " +
          (index + 1),
          "ok"
        );

        video.play().catch(() => {});

      }
    );


    hls.on(
      Hls.Events.ERROR,
      function(event,data) {

        console.log("HLS:",data);

        if(data.fatal) {

          setStatus(
            "🔴 Không phát được Link " +
            (index + 1) +
            " — " +
            data.details,
            "error"
          );

        }

      }
    );

  }

  /*
    Safari có HLS native
  */

  else if(
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ) {

    video.src = url;

    video.addEventListener(
      "loadedmetadata",
      function() {

        setStatus(
          "🟢 Đang phát — Link " +
          (index + 1),
          "ok"
        );

        video.play().catch(() => {
          setStatus(
            "🟡 Stream đã tải — bấm ▶ để phát",
            "ok"
          );
        });

      },
      {once:true}
    );

  }

  else {

    setStatus(
      "❌ Trình duyệt không hỗ trợ HLS",
      "error"
    );

  }

}


/* =========================================================
   PHÁT LINK ĐANG CHỌN
========================================================= */

function playCurrent() {

  const index = Number(
    templateSelect.value
  );

  playUrl(
    getUrl(index),
    index
  );

}


/* =========================================================
   DỪNG
========================================================= */

function stopPlayer() {

  destroyPlayer();

  setStatus(
    "⚪ Đã dừng"
  );

}


/* =========================================================
   COPY URL
========================================================= */

async function copyUrl() {

  const url = urlBox.value;

  try {

    await navigator.clipboard.writeText(url);

    setStatus(
      "📋 Đã copy link",
      "ok"
    );

  }

  catch(error) {

    urlBox.select();
    document.execCommand("copy");

    setStatus(
      "📋 Đã copy link",
      "ok"
    );

  }

}


/* =========================================================
   VIDEO EVENTS
========================================================= */

video.addEventListener(
  "playing",
  function() {

    setStatus(
      "🟢 Đang phát — Link " +
      (currentPlayingLink + 1),
      "ok"
    );

  }
);

video.addEventListener(
  "waiting",
  function() {

    setStatus(
      "⏳ Đang tải dữ liệu..."
    );

  }
);

video.addEventListener(
  "error",
  function() {

    setStatus(
      "🔴 Video không thể phát",
      "error"
    );

  }
);


/* =========================================================
   PHÍM TẮT
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    /*
      Không kích hoạt phím tắt khi đang nhập
    */

    if(
      event.target.tagName === "INPUT" ||
      event.target.tagName === "TEXTAREA"
    ) {
      return;
    }


    if(event.key === "ArrowRight") {
      nextLink();
    }

    else if(event.key === "ArrowLeft") {
      prevLink();
    }

    else if(event.key === "ArrowDown") {
      nextChannel();
    }

    else if(event.key === "ArrowUp") {
      prevChannel();
    }

    else if(event.key === "Enter") {
      playCurrent();
    }

  }
);


/* Khởi tạo URL */
updateUrl();

</script>
</body>
</html>
