<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M3U8 STREAM SCANNING</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
  --bg: #050805;
  --panel: #0a110a;
  --panel2: #050905;
  --border: #173817;
  --text: #b7ffb7;
  --muted: #5f9b5f;
  --accent: #20e020;
  --accent2: #13b913;
  --danger: #ef4444;
  --ok: #20e020;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #030603;
  color: #b7ffb7;
  font-family: Arial, Helvetica, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: min(1180px, 100%);
  margin: auto;
  padding: 22px;
}

header { margin-bottom: 18px; }

h1 {
  margin: 0;
  font-size: 23px;
  color: #45ff45;
  letter-spacing: 1px;
  text-shadow: 0 0 8px rgba(32, 224, 32, .28);
}

.subtitle {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}

.card {
  background: #081008;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}

.player {
  background: #000;
  border-radius: 11px;
  overflow: hidden;
  aspect-ratio: 16/9;
}

video {
  display: block;
  width: 100%;
  height: 100%;
  background: #000;
}

.status {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--panel2);
  color: var(--muted);
  font-size: 13px;
  min-height: 44px;
  word-break: break-word;
}

.status.ok { color: #86efac; }
.status.error { color: #fca5a5; }

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

label {
  display: block;
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

select, input {
  -webkit-appearance: none;
  appearance: none;
  touch-action: manipulation;
  width: 100%;
  height: 44px;
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  background: #050905;
  color: var(--text);
  font-size: 16px;
}

select:focus, input:focus { border-color: var(--accent); }

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* === COMMON STYLES === */
.manual-channel-row, .channel-row, .vid-scan-control {
  display: flex;
  gap: 8px;
  width: 100%;
}

.manual-channel-row { align-items: center; }
.channel-row { align-items: center; }
.vid-scan-control { align-items: flex-end; flex-wrap: wrap; }

.manual-channel-row input { flex: 1 1 360px; min-width: 0; }

.manual-channel-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
}

.manual-channel-actions button { white-space: nowrap; }

.channel-row select {
  flex: 1 1 360px;
  min-width: 260px;
  width: 100%;
}

.channel-nav {
  position: relative;
  z-index: 30;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 8px;
  flex: 0 0 auto;
  white-space: nowrap;
}

.channel-nav button {
  position: relative;
  z-index: 31;
  pointer-events: auto;
  white-space: nowrap;
}

/* Hai nút tự động hóa xuống một hàng riêng */
#autoScanBtn, #resetAutoScanBtn {
  flex: 1 1 calc(50% - 4px);
}

#autoScanBtn {
  margin-left: 0;
}

#resetAutoScanBtn {
  margin-left: 0;
}


.vid-scan-number {
  flex: 0 0 100px;
}

.vid-scan-number input {
  width: 100px;
  box-sizing: border-box;
  text-align: center;
}

.vid-scan-nav {
  display: flex;
  gap: 8px;
  flex: 1;
}

.vid-scan-nav button { flex: 1; }

.vid-scan-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 8px;
  width: 100%;
}

.vid-scan-actions button { width: 100%; }

/* === RANGE INPUTS === */
.vid-range-inputs {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 10px;
  flex-wrap: wrap;
}

.vid-range-inputs input {
  flex: 1;
  min-width: 80px;
  max-width: 150px;
  height: 44px;
  text-align: center;
}

.vid-range-inputs span {
  color: var(--muted);
  font-weight: 700;
}

.vid-range-inputs .range-btn {
  flex: 0 0 auto;
  height: 40px;
  padding: 8px 12px;
  font-size: 12px;
}

.counter {
  margin-top: 9px;
  color: var(--muted);
  font-size: 12px;
}

/* === BUTTONS === */
button {
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  position: relative;
  z-index: 20;
  border: 1px solid #25d925;
  border-radius: 7px;
  padding: 10px 14px;
  background: #0b240b;
  color: #7dff7d;
  font-weight: 700;
  cursor: pointer;
  text-transform: uppercase;
  min-height: 44px;
  -webkit-touch-callout: none;
  max-width: 100%;
  box-sizing: border-box;
}

button:hover {
  background: #123812;
  color: #b7ffb7;
  box-shadow: 0 0 8px rgba(32, 224, 32, .18);
}

button:disabled {
  opacity: .65;
  cursor: not-allowed;
  box-shadow: none;
}

button.secondary {
  background: #0b1a0b;
  color: #8cff8c;
  border: 1px solid #1c4d1c;
}

button.secondary:hover {
  background: #102410;
  color: #b7ffb7;
}

button.danger {
  background: var(--danger);
  color: #fff;
  border-color: #dc2626;
}

button.danger:hover {
  background: #dc2626;
  color: #fff;
}

button.stop-btn {
  background: #f59e0b;
  color: #000;
  border-color: #d97706;
}

button.stop-btn:hover {
  background: #d97706;
  color: #fff;
}

button.auto-all-btn {
  background: #7c3aed;
  color: #fff;
  border-color: #8b5cf6;
}

button.auto-all-btn:hover {
  background: #6d28d9;
  color: #fff;
}

.auto-all-status {
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel2);
  color: var(--muted);
  font-size: 12px;
}

/* === RESULT TABLE === */
.result-table-wrap, .vid-result-list {
  margin-top: 12px;
  max-height: 300px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel2);
  -webkit-overflow-scrolling: touch;
}

.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 550px;
}

.result-table thead {
  position: sticky;
  top: 0;
  z-index: 10;
}

.result-table th {
  background: #0d1a0d;
  color: #86efac;
  padding: 10px 12px;
  text-align: left;
  border-bottom: 2px solid var(--border);
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 0.5px;
}

.result-table td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text);
}

.result-table tr.found { background: #0b1a0b; }
.result-table tr.found td { color: #86efac; }

.result-table .link-cell {
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: Consolas, monospace;
  font-size: 12px;
  color: #b7ffb7;
  cursor: pointer;
}

.result-table .link-cell:hover { color: #45ff45; }

.result-summary, .vid-result-summary {
  padding: 10px 12px;
  color: var(--muted);
  font-size: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.result-summary .found-count, .vid-result-summary .vid-found-count {
  color: #86efac;
  font-weight: 700;
}

.no-results {
  padding: 30px 20px;
  text-align: center;
  color: var(--muted);
  font-style: italic;
}

.copy-btn, .vid-copy-btn, .result-clear-btn, .vid-clear-btn {
  padding: 6px 12px;
  font-size: 10px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  border-radius: 4px;
  text-transform: none;
  font-weight: 400;
  white-space: nowrap;
  min-height: 32px;
}

.copy-btn:hover, .vid-copy-btn:hover {
  background: var(--border);
  color: var(--text);
}

.result-clear-btn, .vid-clear-btn {
  border-color: #ef4444;
  color: #ef4444;
}

.result-clear-btn:hover, .vid-clear-btn:hover {
  background: #ef4444;
  color: #fff;
}

.found-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  background: #20e020;
  color: #000;
}

/* === VID RESULT ITEMS === */
.vid-result-head {
  display: grid;
  grid-template-columns: 60px minmax(220px, 1fr) minmax(220px, 1fr) 150px;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: rgba(32, 224, 32, 0.08);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
}

.vid-result-item {
  display: grid;
  grid-template-columns: 60px minmax(220px, 1fr) minmax(220px, 1fr) 150px;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
  cursor: pointer;
  transition: background 0.2s;
}

.vid-result-item:hover { background: var(--border); }
.vid-result-item:last-child { border-bottom: none; }

.vid-result-item .vid-number {
  font-weight: 700;
  color: var(--accent);
  font-size: 13px;
}

.vid-result-item .vid-link,
.vid-result-item .vid-dest {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  font-family: Consolas, monospace;
  color: var(--text);
}

.vid-result-item .vid-link:hover,
.vid-result-item .vid-dest:hover { color: #45ff45; }
.vid-result-item .vid-dest { color: #9ca3af; }
.vid-copy-group {
  display: flex;
  justify-content: flex-end;
  gap: 5px;
  flex-wrap: wrap;
}
.vid-copy-group .vid-copy-btn {
  white-space: nowrap;
  font-size: 10px;
  padding: 5px 7px;
}
.vid-result-empty { padding: 20px; text-align: center; color: var(--muted); font-style: italic; font-size: 13px; }

@media (max-width: 900px) {
  .vid-result-head { display: none; }
  .vid-result-item {
    grid-template-columns: 55px 1fr;
  }
  .vid-result-item .vid-link,
  .vid-result-item .vid-dest { grid-column: 2; }
  .vid-copy-group { grid-column: 2; justify-content: flex-start; }
}

/* === PANEL === */
.scan-panel { overflow: hidden; }
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 0;
}
.panel-head label { margin: 0; }
.panel-toggle {
  padding: 7px 11px;
  font-size: 11px;
  text-transform: uppercase;
  white-space: nowrap;
  min-height: 36px;
}
.panel-body { margin-top: 12px; }
.panel-body.is-hidden { display: none; }

.result-section {
  margin-top: 16px;
  border-top: 1px solid var(--border);
  padding-top: 14px;
}

.result-section .result-label {
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* === SCROLLBAR === */
.result-table-wrap::-webkit-scrollbar, .vid-result-list::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
.result-table-wrap::-webkit-scrollbar-track, .vid-result-list::-webkit-scrollbar-track {
  background: var(--panel2);
}
.result-table-wrap::-webkit-scrollbar-thumb, .vid-result-list::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 3px;
}
.result-table-wrap::-webkit-scrollbar-thumb:hover, .vid-result-list::-webkit-scrollbar-thumb:hover {
  background: var(--muted);
}

.card > *, .panel-body > *, .grid > *, .channel-row > *, .vid-scan-control > * {
  max-width: 100%;
  min-width: 0;
}

/* === RESPONSIVE === */
@media(max-width:760px) {
  .grid { grid-template-columns: 1fr; min-width: 0; }
  h1 { font-size: 22px; overflow-wrap: anywhere; }
  select, input {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    height: 44px;
    padding: 6px 10px;
    font-size: 16px;
  }
  .status, .counter { max-width: 100%; overflow-wrap: anywhere; }
}

@media(max-width:600px) {
  .app {
    width: 100%;
    max-width: 100%;
    padding: 12px max(12px, env(safe-area-inset-right)) 12px max(12px, env(safe-area-inset-left));
  }

  .card, .grid, .grid > div, .panel-body, .channel-row, .manual-channel-row, .vid-scan-control {
    min-width: 0;
    max-width: 100%;
  }

  /* Manual channel */
  .manual-channel-row {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .manual-channel-row input {
    width: 100%;
    min-width: 0;
    flex: 0 0 44px;
    height: 44px;
    font-size: 16px;
  }
  .manual-channel-actions {
    display: flex;
    width: 100%;
    min-width: 0;
    gap: 8px;
  }
  .manual-channel-actions button {
    flex: 1 1 0;
    min-width: 0;
    width: 0;
    height: 44px;
    padding: 8px 5px;
    font-size: 12px;
    white-space: normal;
  }

  /* Channel row */
  .channel-row {
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .channel-row select {
    width: 100%;
    min-width: 0;
    flex: 0 0 auto;
  }
  .channel-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    min-width: 0;
    gap: 8px;
  }
  .channel-nav button {
    width: 100%;
    min-width: 0;
    flex: initial;
    padding: 9px 4px;
    font-size: 11px;
    line-height: 1.15;
    white-space: normal;
    overflow-wrap: anywhere;
  }

  /* Vid scan */
  .vid-scan-control { flex-wrap: wrap; width: 100%; min-width: 0; }
  .vid-scan-number { flex: 0 0 100%; width: 100%; }
  .vid-scan-number input { display: block; margin: auto; }
  .vid-scan-nav {
    display: grid;
    grid-template-columns: 1fr 1fr;
    width: 100%;
    min-width: 0;
    gap: 8px;
  }
  .vid-scan-nav button {
    width: 100%;
    min-width: 0;
    padding: 9px 4px;
    font-size: 11px;
    line-height: 1.15;
    white-space: normal;
  }
  .vid-scan-control .vid-scan-actions { width: 100%; min-width: 0; }
  .vid-scan-actions { grid-template-columns: 1fr; }
  .vid-scan-actions button {
    min-width: 0;
    white-space: normal;
    font-size: 11px;
  }

  /* Range inputs */
  .vid-range-inputs { flex-direction: row; align-items: center; }
  .vid-range-inputs input {
    flex: 1 1 70px;
    max-width: 120px;
    width: auto;
  }
  .vid-range-inputs .range-btn {
    width: auto;
    flex: 0 0 auto;
  }

  /* Result table */
  .result-table-wrap { max-height: 250px; }
  .result-table { font-size: 11px; min-width: 380px; }
  .result-table th, .result-table td { padding: 6px 8px; }
  .result-table .link-cell { max-width: 120px; font-size: 10px; }
  .copy-btn { padding: 4px 8px; font-size: 9px; min-height: 28px; }
}
</style>
</head>

<body>
<div class="app">

<header>
  <h1>⌨ M3U8 // STREAM SCANNING</h1>
</header>

<!-- PLAYER -->
<div class="card">
  <div class="player">
    <video id="video" controls playsinline webkit-playsinline x-webkit-airplay="allow"></video>
  </div>
  <div id="status" class="status">⚪ Chưa phát stream</div>
</div>

<!-- CHANNEL SCANNING -->
<div class="card scan-panel" id="channelPanel">
  <div class="panel-head">
    <label>▸ DÒ KÊNH THỦ CÔNG</label>
    <button class="secondary panel-toggle" type="button" onclick="togglePanel('channelBody','channelToggle')" aria-expanded="true">
      <span id="channelToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="channelBody">
    <div class="grid">
      <div>
        <div class="manual-channel-row">
          <input id="manualChannelInput" type="text" placeholder="Ví dụ: vtv1" autocomplete="off" aria-label="Nhập tên kênh thủ công">
          <div class="manual-channel-actions">
            <button class="secondary" onclick="useManualChannel()" aria-label="Dùng kênh thủ công">DÙNG KÊNH</button>
            <button class="danger" onclick="clearManualChannel()" aria-label="Xóa kênh thủ công">XÓA KÊNH</button>
          </div>
        </div>
        <div class="counter">Kênh nhập thủ công chỉ dùng trong lần này — không lưu lại sau khi F5.</div>

        <label style="margin-top:12px">▸ CHỌN LIST KÊNH</label>
        <div class="channel-row">
          <select id="channelSelect" aria-label="Chọn kênh"></select>
          <div class="channel-nav">
            <button id="prevChannelBtn" class="secondary" type="button" aria-label="Kênh trước">⬅ KÊNH TRƯỚC</button>
            <button id="nextChannelBtn" class="secondary" type="button" aria-label="Kênh sau">KÊNH SAU ➡</button>
            <button id="autoScanBtn" class="danger" type="button" aria-label="Dò tự động">⚡ DÒ TỰ ĐỘNG</button>
            <button id="resetAutoScanBtn" class="secondary" type="button" aria-label="Dò lại từ đầu">↻ DÒ LẠI TỪ ĐẦU</button>
            <button id="autoAllScanBtn" class="auto-all-btn" type="button" aria-label="Dò kênh tự động hóa">🤖 DÒ KÊNH TỰ ĐỘNG HÓA</button>
            <button id="stopAutoAllBtn" class="stop-btn" type="button" aria-label="Dừng dò kênh tự động hóa" style="display:none;">⏹ DỪNG TỰ ĐỘNG HÓA</button>
          </div>
        </div>
        <div id="channelCounter" class="counter"></div>
        <div id="autoAllStatus" class="auto-all-status">🤖 Tự động hóa: Sẵn sàng</div>
      </div>

      <div>
        <label>▸ STREAM SOURCE</label>
        <select id="templateSelect" aria-label="Chọn link stream"></select>
        <div id="linkCounter" class="counter"></div>
      </div>
    </div>

    <!-- RESULT TABLE -->
    <div class="result-section">
      <div class="result-label">
        <span>▸ STREAM URL RESULT</span>
      </div>
      <div class="result-table-wrap" id="resultTableWrap">
        <table class="result-table" id="resultTable">
          <thead>
            <tr>
              <th style="width:50px;">STT</th>
              <th style="width:130px;">KÊNH</th>
              <th style="width:100px;">LINK #</th>
              <th>ĐƯỜNG DẪN</th>
              <th style="width:70px;">COPY</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <div class="result-summary" id="resultSummary">
        <span>🔍 Tổng số link phát được: <span class="found-count" id="foundLinks">0</span></span>
        <button class="result-clear-btn" onclick="exportResultsToExcel()">📊 XUẤT EXCEL</button>
        <button class="result-clear-btn" onclick="clearResults()">🗑 XÓA</button>
      </div>
    </div>
  </div>
</div>

<!-- FREEM3U SCANNING -->
<div class="card scan-panel" id="vidScanPanel">
  <div class="panel-head">
    <label>▸ FREEM3U // DÒ KÊNH THEO SỐ</label>
    <button class="secondary panel-toggle" type="button" onclick="togglePanel('vidScanBody','vidScanToggle')" aria-expanded="true">
      <span id="vidScanToggle">▲ ẨN</span>
    </button>
  </div>

  <div class="panel-body" id="vidScanBody">
    <div class="vid-range-inputs" style="margin-top:0;">
      <input id="vidRangeFrom" type="number" min="1" max="999" value="1" aria-label="Từ số" placeholder="Từ">
      <span>→</span>
      <input id="vidRangeTo" type="number" min="1" max="999" value="10" aria-label="Đến số" placeholder="Đến">
      <button class="danger range-btn" id="vidRangeScanBtn" onclick="startRangeVidScan()" aria-label="Dò khoảng số">🚀 DÒ</button>

function bindIOSButton(button, handler) {
  if (!button) return;
  let lastTouch = 0;
  let isTouching = false;

  button.addEventListener("touchstart", function(event) {
    isTouching = true;
    lastTouch = Date.now();
  }, { passive: true });

  button.addEventListener("touchend", function(event) {
    if (isTouching) {
      isTouching = false;
      event.preventDefault();
      event.stopPropagation();
      setTimeout(() => handler(), 50);
    }
  }, { passive: false });

  button.addEventListener("click", function(event) {
    if (Date.now() - lastTouch < 300) {
      event.preventDefault();
      return;
    }
    event.preventDefault();
    event.stopPropagation();
    handler();
  }, false);
}

/* =========================================================

========================================================= */
function copyToClipboard(text) {
  if (!text) return;

  const fallbackCopy = (txt) => {
    const textarea = document.createElement('textarea');
    textarea.value = txt;
    textarea.style.cssText = 'position:fixed;opacity:0;top:-100px;left:-100px;';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      setStatus("📋 Đã copy: " + txt.substring(0, 50) + (txt.length > 50 ? '...' : ''), "ok");
    } catch (e) {
      setStatus("❌ Không thể copy", "error");
    }
    document.body.removeChild(textarea);
  };

  if (isIOS()) {
    const tempInput = document.createElement('input');
    tempInput.value = text;
    tempInput.style.cssText = 'position:fixed;opacity:0;top:-100px;left:-100px;';
    document.body.appendChild(tempInput);
    tempInput.select();
    tempInput.setSelectionRange(0, 99999);
    try {
      document.execCommand('copy');
      setStatus("📋 Đã copy: " + text.substring(0, 50) + (text.length > 50 ? '...' : ''), "ok");
    } catch (e) {
      setStatus("❌ Không thể copy", "error");
    }
    document.body.removeChild(tempInput);
    return;
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      setStatus("📋 Đã copy: " + text.substring(0, 50) + (text.length > 50 ? '...' : ''), "ok");
    }).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
}

/* =========================================================
   HLS PLAYBACK ENGINE
========================================================= */
function setupHlsPlayback(url, { onPlaying, onError, timeout = 15000 } = {}) {
  let finished = false;
  let timer = null;
  let nativeCleanup = null;
  let localHls = null;

  const cleanup = () => {
    if (timer) clearTimeout(timer);
    timer = null;
    if (state.activeNativeTimeout) {
      clearTimeout(state.activeNativeTimeout);
      state.activeNativeTimeout = null;
    }
    if (nativeCleanup) {
      nativeCleanup();
      nativeCleanup = null;
    }
    if (localHls && isHlsEventsAvailable()) {
      localHls.off(Hls.Events.MANIFEST_PARSED, onManifestParsed);
      localHls.off(Hls.Events.ERROR, onHlsError);
    }
  };

  const finish = (success) => {
    if (finished) return;
    finished = true;
    cleanup();
    if (success) onPlaying?.();
    else onError?.();
  };

  const onManifestParsed = () => video.play().catch(() => {});
  const onHlsError = (event, data) => {
    if (data?.fatal) finish(false);
  };
  const onVideoPlaying = () => finish(true);
  const onVideoError = () => finish(false);

  if (onPlaying) video.addEventListener("playing", onVideoPlaying, { once: true });
  if (onError) video.addEventListener("error", onVideoError, { once: true });

  // Native HLS (Safari/iOS and other browsers that expose native HLS)
  if (isNativeHLSSupported()) {
    const onLoadedMetadata = () => video.play().catch(() => {});
    const onErrorNative = () => finish(false);
    nativeCleanup = () => {
      video.removeEventListener("loadedmetadata", onLoadedMetadata);
      video.removeEventListener("error", onErrorNative);
    };
    video.addEventListener("loadedmetadata", onLoadedMetadata, { once: true });
    video.addEventListener("error", onErrorNative, { once: true });
    video.src = url;
    video.load();
  } else if (isHlsSupported()) {
    try {
      localHls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
      state.hls = localHls;
      if (isHlsEventsAvailable()) {
        localHls.on(Hls.Events.MANIFEST_PARSED, onManifestParsed);
        localHls.on(Hls.Events.ERROR, onHlsError);
      }
      localHls.loadSource(url);
      localHls.attachMedia(video);
    } catch (e) {
      console.error("HLS playback:", e);
      finish(false);
      return { cancel: () => finish(false) };
    }
  } else {
    finish(false);
    return { cancel: () => finish(false) };
  }

  timer = setTimeout(() => finish(false), timeout);
  return { cancel: () => finish(false) };
}

  const cancel = setupHlsPlayback(url, {
    onPlaying: () => {
      if (type === "freem3u") {
        setStatus("🟢 FREEM3U — Đang phát kênh #" + number, "ok");
        setVidScanStatus("🟢 Đang phát kênh #" + number, "ok");

      } else {
        setStatus("🟢 Đang phát — Link " + (index + 1), "ok");
        if (type === "result") {
          templateSelect.selectedIndex = index;
          updateUrl();
        }
      }
    },
    onError: () => {
      if (type === "freem3u") {
        setStatus("🔴 Không phát được FreeM3U #" + number, "error");
        state.freem3uPlaying = false;
        state.freem3uPlayingNumber = null;
        updateVidResultList();
      } else {
        setStatus("🔴 Không phát được Link " + (index + 1), "error");
      }
    }
  });
  state.activePlaybackCancel = cancel ? cancel.cancel : null;
}

function tryAutoScanLink(index, token, mode = "normal") {
  return new Promise((resolve) => {
    if ((mode === "all" ? token !== state.autoAllToken : token !== state.autoScanToken)) { resolve(false); return; }

    const url = getUrl(index);
    state.currentPlayingLink = index;
    templateSelect.selectedIndex = index;
    setStatus("🔎 Đang kiểm tra " + getActiveChannelCode() + " — Link " + (index + 1) + "/" + templates.length + "...");

    let done = false;
    let timer = null;
    let probeHls = null;
    let nativeCleanup = null;
    let nativeTimeout = null;

    const finish = (ok) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      if (nativeTimeout) { clearTimeout(nativeTimeout); nativeTimeout = null; }
      if (probeHls) {
        const probe = probeHls;
        probeHls = null;
        if (state.activeProbeHls === probe) state.activeProbeHls = null;
        try { probe.destroy(); } catch(e) {}
      }
      if (nativeCleanup) { nativeCleanup(); nativeCleanup = null; }
      if (ok) addFoundResult(index, url, getActiveChannelCode());
      resolve(ok);
    };

    timer = setTimeout(() => finish(false), 15000);

    // Native HLS probe
    if (isIOS() && isNativeHLSSupported()) {
      const onLoadedMetadata = () => { if (nativeCleanup) nativeCleanup(); finish(true); };
      const onError = () => { if (nativeCleanup) nativeCleanup(); finish(false); };
      nativeCleanup = () => {
        video.removeEventListener("loadedmetadata", onLoadedMetadata);
        video.removeEventListener("error", onError);
        video.removeAttribute("src");
        video.load();
      };
      video.addEventListener("loadedmetadata", onLoadedMetadata, { once: true });
      video.addEventListener("error", onError, { once: true });
      video.src = url;
      video.load();
      nativeTimeout = setTimeout(() => { if (!done) finish(false); }, 10000);
      return;
    }

    // HLS.js probe
    if (isHlsSupported()) {
      try {
        probeHls = new Hls({ enableWorker: true, lowLatencyMode: true, backBufferLength: 30 });
        state.activeProbeHls = probeHls;
        if (isHlsEventsAvailable()) {
          probeHls.once(Hls.Events.MANIFEST_PARSED, () => finish(true));
          probeHls.once(Hls.Events.ERROR, (event, data) => {
            if (data?.fatal) {
              if (probeHls) {
                const probe = probeHls;
                probeHls = null;
                if (state.activeProbeHls === probe) state.activeProbeHls = null;
                try { probe.destroy(); } catch(e) {}
              }
              finish(false);
            }
          });
        } else {
          setTimeout(() => finish(false), 5000);
        }
        probeHls.attachMedia(video);
        probeHls.loadSource(url);
      } catch(e) {
        console.error("Probe HLS:", e);
        if (probeHls) {
          const probe = probeHls;
          probeHls = null;
          if (state.activeProbeHls === probe) state.activeProbeHls = null;
          try { probe.destroy(); } catch(e) {}
        }
        finish(false);
      }
      return;
    }

    finish(false);
  });
}

function autoScanLinks() {
  if (state.autoScanning) {
    setStatus("⏳ Đang dò, vui lòng chờ...", "ok");
    return;
  }

  const input = document.getElementById("manualChannelInput");
  const typedCode = input ? input.value.trim() : "";
  if (typedCode && typedCode !== state.manualChannelCode.trim()) {
    state.manualChannelCode = typedCode;
    state.autoScanNextIndex = 0;
    state.autoScanToken++;
  }

  const code = getActiveChannelCode().trim();
  if (!code) {
    setStatus("⚠️ Chưa có mã kênh để dò", "error");
    return;
  }

  state.foundResults = [];
  state.lastFoundIndex = null;
  updateResultTable();

  if (state.autoScanNextIndex >= templates.length) {
    setStatus("⚪ " + code + " đã dò hết " + templates.length + " link — bấm DÒ LẠI TỪ ĐẦU", "error");
    return;
  }

  state.vidScanToken++;
  state.vidScanning = false;
  state.freem3uPlaying = false;
  state.freem3uPlayingNumber = null;
  setRangeScanButtons(false);
  cancelActiveProbe();

  state.autoScanning = true;
  state.autoScanToken++;
  const token = state.autoScanToken;
  let index = state.autoScanNextIndex;
  setAutoScanButton(true);

  const scanNext = () => {
    if (token !== state.autoScanToken || !state.autoScanning) {
      state.autoScanTimer = null;
      return;
    }

    if (index >= templates.length) {
      state.autoScanNextIndex = templates.length;
      state.autoScanning = false;
      setAutoScanButton(false);
      state.autoScanTimer = null;
      
      const foundCount = state.foundResults.length;
      if (foundCount > 0 && state.lastFoundIndex !== null) {
        templateSelect.selectedIndex = state.lastFoundIndex;
        updateUrl();
        setTimeout(() => playUrl(getUrl(state.lastFoundIndex), state.lastFoundIndex), 300);
        setStatus("✅ Dò xong! Tìm thấy " + foundCount + " link. Đang phát link cuối cùng (Link " + (state.lastFoundIndex + 1) + ")", "ok");
      } else if (foundCount > 0) {
        setStatus("✅ Dò xong! Tìm thấy " + foundCount + " link phát được cho " + code, "ok");
      } else {
        setStatus("🔴 Đã dò hết " + templates.length + " link, không tìm thấy link nào phát được", "error");
      }
      return;
    }

    const testIndex = index++;
    state.autoScanNextIndex = index;

    tryAutoScanLink(testIndex, token).then(success => {
      if (token !== state.autoScanToken || !state.autoScanning) {
        state.autoScanTimer = null;
        return;
      }
      if (success) setStatus("✅ Tìm thấy link " + (testIndex + 1) + " — tiếp tục dò...", "ok");
      const timer = setTimeout(scanNext, isIOS() ? 100 : 30);
      state.autoScanTimer = timer;
    }).catch(err => {
      console.error("Auto scan:", err);
      if (token === state.autoScanToken && state.autoScanning) {
        const timer = setTimeout(scanNext, isIOS() ? 200 : 100);
        state.autoScanTimer = timer;
      } else {
        state.autoScanTimer = null;
      }
    });
  };

  templateSelect.selectedIndex = 0;
  updateUrl();
  setStatus("🔎 Bắt đầu dò kênh " + code + " từ Link 1...");
  setTimeout(scanNext, isIOS() ? 100 : 0);
}

/* =========================================================
   FULL AUTO CHANNEL + LINK SCAN
========================================================= */
function stopAutoChannelScan() {
  if (!state.autoAllScanning) return;
  state.autoAllToken++;
  state.autoAllScanning = false;
  state.autoAllChannelIndex = 0;
  state.autoAllLinkIndex = 0;
  if (state.autoScanTimer) {
    clearTimeout(state.autoScanTimer);
    state.autoScanTimer = null;
  }
  setAutoAllButtons(false);
  cancelActiveProbe();
  setAutoAllStatus("⏹ Đã dừng DÒ KÊNH TỰ ĐỘNG HÓA. Kết quả đã tìm được vẫn được giữ lại.", "error");
  setStatus("⏹ Đã dừng tự động hóa — kết quả đã tìm được vẫn còn bên dưới.", "error");
}

function autoScanAllChannels() {
  if (state.autoAllScanning) {
    setStatus("⏳ DÒ KÊNH TỰ ĐỘNG HÓA đang chạy...", "ok");
    return;
  }
  if (!channels.length || !templates.length) {
    setStatus("⚠️ Chưa có danh sách kênh hoặc link để dò.", "error");
    return;
  }

  // Nếu đang chạy FreeM3U thì dừng trước khi bắt đầu.
  stopRangeVidScan({ silent: true });
  resetAutoScanIndex();

  // Giữ nguyên kết quả cũ khi dò lại; kết quả mới sẽ nối tiếp xuống dưới.

  state.autoAllScanning = true;
  state.autoAllToken++;
  const token = state.autoAllToken;
  state.autoAllChannelIndex = Math.max(0, channelSelect.selectedIndex);
  state.autoAllLinkIndex = 0;
  setAutoAllButtons(true);

  const scanStep = () => {
    if (token !== state.autoAllToken || !state.autoAllScanning) return;

    if (state.autoAllChannelIndex >= channels.length) {
      state.autoAllScanning = false;
      state.autoAllChannelIndex = channels.length;
      state.autoAllLinkIndex = templates.length;
      setAutoAllButtons(false);
      state.autoScanTimer = null;
      setAutoAllStatus("✅ ĐÃ DÒ XONG TOÀN BỘ " + channels.length + " KÊNH × " + templates.length + " LINK.", "ok");
      setStatus("✅ Dò tự động hóa hoàn tất — tìm thấy " + state.foundResults.length + " link. Kết quả nằm bên dưới.", "ok");
      return;
    }

    const channelIndex = state.autoAllChannelIndex;
    const linkIndex = state.autoAllLinkIndex;
    const code = channels[channelIndex];

    // Chuyển UI sang đúng kênh/link đang dò.
    state.manualChannelCode = "";
    const manualInput = document.getElementById("manualChannelInput");
    if (manualInput) manualInput.value = "";
    channelSelect.selectedIndex = channelIndex;
    templateSelect.selectedIndex = linkIndex;
    updateUrl();

    setAutoAllStatus(
      "🤖 Kênh " + (channelIndex + 1) + "/" + channels.length + " — " + code +
      " | Link " + (linkIndex + 1) + "/" + templates.length +
      " | Đã tìm thấy: " + state.foundResults.length,
      "ok"
    );
    setStatus("🔎 Tự động hóa: " + code + " — Link " + (linkIndex + 1) + "/" + templates.length + "...");

    tryAutoScanLink(linkIndex, token, "all").then((success) => {
      if (token !== state.autoAllToken || !state.autoAllScanning) return;

      // tryAutoScanLink dùng getActiveChannelCode(), nên kết quả đã gắn đúng kênh.
      state.autoAllLinkIndex++;
      if (success) {
        setAutoAllStatus(
          "🟢 " + code + " — Link " + (linkIndex + 1) + " CÓ KẾT QUẢ | Tổng: " + state.foundResults.length,
          "ok"
        );
      }

      if (state.autoAllLinkIndex >= templates.length) {
        state.autoAllChannelIndex++;
        state.autoAllLinkIndex = 0;
      }

      state.autoScanTimer = setTimeout(scanStep, success ? 120 : 30);
    }).catch((error) => {
      console.error("Full auto scan:", error);
      if (token !== state.autoAllToken || !state.autoAllScanning) return;
      state.autoAllLinkIndex++;
      if (state.autoAllLinkIndex >= templates.length) {
        state.autoAllChannelIndex++;
        state.autoAllLinkIndex = 0;
      }
      state.autoScanTimer = setTimeout(scanStep, 50);
    });
  };

  setAutoAllStatus("🚀 Bắt đầu từ kênh " + channels[state.autoAllChannelIndex] + " — Link 1...", "ok");
  state.autoScanTimer = setTimeout(scanStep, isIOS() ? 150 : 0);
}

/* =========================================================
   RESULTS TABLE
========================================================= */
function updateResultTable() {
  const tbody = document.getElementById('resultBody');
  const foundSpan = document.getElementById('foundLinks');
  if (!tbody) return;
  
  tbody.innerHTML = '';
  if (state.foundResults.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="no-results">⚪ Chưa tìm thấy link nào phát được. Hãy bấm DÒ TỰ ĐỘNG.</td></tr>`;
    if (foundSpan) foundSpan.textContent = '0';
    return;
  }

  state.foundResults.forEach((result, index) => {
    const tr = document.createElement('tr');
    tr.className = 'found';
    tr.style.cursor = 'pointer';
    tr.addEventListener('click', function(event) {
      if (event.target.closest('button')) return;
      playStreamUrl(result.url, result.index);
    });
    const escapedUrl = result.url.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    tr.innerHTML = `
      <td>${index + 1}</td>
      <td style="font-size:11px;">${escapeHtml(result.channel || getActiveChannelCode() || 'N/A')}</td>
      <td style="font-size:11px;">${result.index + 1}</td>
      <td class="link-cell" style="color:red;" title="${result.url}" onclick="playStreamUrl('${escapedUrl}', ${result.index})">${result.url}</td>
      <td><button class="copy-btn" onclick="copyToClipboard('${escapedUrl}')">📋 COPY</button></td>
    `;
    tbody.appendChild(tr);
  });
  if (foundSpan) foundSpan.textContent = state.foundResults.length;
}

function addFoundResult(index, url, channel = getActiveChannelCode()) {
  const name = templates[index]?.name || `Link ${index + 1}`;
  const existing = state.foundResults.find(r => r.url === url && r.channel === channel);
  if (existing) return;

  state.foundResults.push({ index, name, url, channel });
  state.lastFoundIndex = index;
  updateResultTable();
}

function exportResultsToExcel() {
  if (!state.foundResults.length) {
    setStatus("⚠️ Chưa có kết quả để xuất Excel", "error");
    return;
  }
  if (typeof XLSX === "undefined") {
    setStatus("❌ Không tải được thư viện Excel", "error");
    return;
  }

  const rows = state.foundResults.map((result, index) => ({
    "STT": index + 1,
    "KÊNH": result.channel || "N/A",
    "LINK #": (result.index ?? index) + 1,
    "ĐƯỜNG DẪN": result.url
  }));

  const worksheet = XLSX.utils.json_to_sheet(rows);
  worksheet["!cols"] = [
    { wch: 8 },
    { wch: 18 },
    { wch: 10 },
    { wch: 100 }
  ];
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Result");

  const now = new Date();
  const stamp = now.toISOString().slice(0, 19).replace(/[T:]/g, "-");
  XLSX.writeFile(workbook, `M3U8_Result_${stamp}.xlsx`);
  setStatus("📊 Đã xuất " + state.foundResults.length + " kết quả ra Excel", "ok");
}

function clearResults() {
  state.foundResults = [];
  state.lastFoundIndex = null;
  updateResultTable();
  setStatus("🗑 Đã xóa toàn bộ kết quả", "ok");
}

/* =========================================================
   VID RESULT LIST
========================================================= */
function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeJsString(value) {
  return String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'")
    .replace(/\r?\n/g, '\\n');
}

function updateVidResultList() {
  const container = document.getElementById('vidResultList');
  const countSpan = document.getElementById('vidFoundLinks');
  if (!container) return;

  if (state.vidFoundResults.length === 0) {
    container.innerHTML = `<div class="vid-result-empty">⚪ Chưa có kết quả dò FreeM3U</div>`;
    if (countSpan) countSpan.textContent = '0';
    return;
  }

  let html = `
    <div class="vid-result-head">
      <span>SỐ</span>
      <span>LINK FREEM3U</span>
      <span>LINK ĐÍCH</span>
      <span>THAO TÁC</span>
    </div>
  `;

  state.vidFoundResults.forEach((result) => {
    const escapedUrl = escapeJsString(result.url);
    const destination = result.destination || 'Không lấy được link đích';
    const escapedDestination = escapeJsString(result.destination || '');
    const isPlaying = state.freem3uPlaying && state.freem3uPlayingNumber === result.number;
    html += `
      <div class="vid-result-item" style="${isPlaying ? 'border-left:3px solid #ffaa00;' : ''}" onclick="playVidUrl('${escapedUrl}', ${result.number})">
        <span class="vid-number">#${result.number}${isPlaying ? ' ▶' : ''}</span>
        <span class="vid-link" title="${escapeHtml(result.url)}">${escapeHtml(result.url)}</span>
        <span class="vid-dest" title="${escapeHtml(destination)}">${escapeHtml(destination)}</span>
        <span class="vid-copy-group">
          <button class="vid-copy-btn" onclick="event.stopPropagation();copyToClipboard('${escapedUrl}')">📋 FREEM3U</button>
          <button class="vid-copy-btn" ${result.destination ? '' : 'disabled'} onclick="event.stopPropagation();copyToClipboard('${escapedDestination}')">🎯 ĐÍCH</button>
        </span>
      </div>
    `;
  });
  container.innerHTML = html;
  if (countSpan) countSpan.textContent = state.vidFoundResults.length;
}

function addVidFoundResult(number, url, destination = '') {
  const existing = state.vidFoundResults.find(r => r.number === number);
  if (existing) {
    existing.url = url;
    existing.destination = destination || existing.destination || '';
  } else {
    state.vidFoundResults.push({ number, url, destination });
  }
  state.vidFoundResults.sort((a, b) => a.number - b.number);
  updateVidResultList();
}

/* =========================================================
   FREEM3U RANGE SCAN
========================================================= */
async function checkNoSignal(url) {
  try {
    const response = await fetch(url, { redirect: "follow", cache: "no-store" });
    const finalUrl = response.url || "";
    if (finalUrl.toLowerCase().includes("no-signal")) {
      return { noSignal: true, destination: finalUrl };
    }

    const text = await response.text();
    const noSignal = text.toLowerCase().includes("no-signal");
    return { noSignal, destination: finalUrl };
  } catch (e) {
    return { noSignal: false, destination: "" };
  }
}

function tryVidNumber(number, token) {
  return new Promise((resolve) => {
    if (token !== state.vidScanToken || !state.vidScanning) {
      resolve(false);
      return;
    }

    const url = getVidUrl(number);
    destroyPlayer();

    const cancelFn = setupHlsPlayback(url, {
      timeout: state.VID_SCAN_TIMEOUT,
      onPlaying: async () => {
        const check = await checkNoSignal(url);
        if (token !== state.vidScanToken || !state.vidScanning) {
          resolve(false);
          return;
        }
        if (check.noSignal) {
          setVidScanStatus("🔴 Kênh #" + number + " — KHÔNG TÍN HIỆU", "error");
          resolve(false);
          return;
        }
        addVidFoundResult(number, url, check.destination);
        resolve(true);
      },
      onError: () => resolve(false)
    });
    state.activePlaybackCancel = cancelFn ? cancelFn.cancel : null;
  });
}

function startRangeVidScan() {
  const fromInput = document.getElementById('vidRangeFrom');
  const toInput = document.getElementById('vidRangeTo');
  let from = parseInt(fromInput.value) || 1;
  let to = parseInt(toInput.value) || 10;
  if (from < 1) from = 1;
  if (to > state.VID_SCAN_MAX) to = state.VID_SCAN_MAX;
  if (from > to) { [from, to] = [to, from]; fromInput.value = from; toInput.value = to; }
  
  if (state.vidScanning) {
    stopRangeVidScan();
    setTimeout(() => startRangeVidScanInternal(from, to), 300);
    return;
  }
  startRangeVidScanInternal(from, to);
}

function startRangeVidScanInternal(from, to) {
  if (from === 1) {
    state.vidFoundResults = [];
    updateVidResultList();
  }
  
  state.vidScanNumber = from;
  state.vidScanning = true;
  state.vidScanToken++;
  cancelActiveProbe();
  
  const token = state.vidScanToken;
  const targetEnd = Math.min(to, state.VID_SCAN_MAX);
  setRangeScanButtons(true);
  setVidScanStatus("🔎 Bắt đầu dò khoảng từ #" + from + " đến #" + targetEnd + "...", "ok");

  function scanNextRange() {
    if (token !== state.vidScanToken || !state.vidScanning) return;
    
    if (state.vidScanNumber > targetEnd) {
      state.vidScanning = false;
      setRangeScanButtons(false);
      setVidScanStatus(
        state.vidFoundResults.length
          ? "🟢 Đã dò xong khoảng #" + from + " → #" + targetEnd + " | Tìm thấy: " + state.vidFoundResults.map(r => r.number).join(", ")
          : "🔴 Đã dò xong khoảng #" + from + " → #" + targetEnd + " mà chưa tìm thấy kênh.",
        state.vidFoundResults.length ? "ok" : "error"
      );
      return;
    }
    
    const number = state.vidScanNumber;
    setVidScanStatus("🔎 Đang dò kênh #" + number + " (từ #" + from + " → #" + targetEnd + ")...");
    
    tryVidNumber(number, token).then((success) => {
      if (token !== state.vidScanToken || !state.vidScanning) return;
      state.vidScanNumber = number + 1;
      if (success) {
        updateVidResultList();
        setTimeout(scanNextRange, isIOS() ? 200 : 100);
      } else {
        setTimeout(scanNextRange, isIOS() ? 50 : 0);
      }
    }).catch(() => {
      if (token !== state.vidScanToken || !state.vidScanning) return;
      state.vidScanNumber = number + 1;
      setTimeout(scanNextRange, isIOS() ? 50 : 0);
    });
  }
  
  setTimeout(scanNextRange, isIOS() ? 100 : 0);
}

function resetVidScan() {
  state.vidScanToken++;
  state.vidScanning = false;
  state.freem3uPlaying = false;
  state.freem3uPlayingNumber = null;
  state.vidScanNumber = 1;
  state.vidFoundResults = [];
  cancelActiveProbe();
  destroyPlayer();
  setRangeScanButtons(false);
  updateVidResultList();
  setVidScanStatus("🔄 Đã reset — sẵn sàng dò khoảng mới.");
  document.getElementById('vidRangeFrom').value = '1';
  document.getElementById('vidRangeTo').value = '10';
}

========================================================= */
document.addEventListener("keydown", function(event) {
  if (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA") return;
  switch(event.key) {
    case "ArrowRight": event.preventDefault(); nextLink(); break;
    case "ArrowLeft": event.preventDefault(); prevLink(); break;
    case "ArrowDown": event.preventDefault(); nextChannel(); break;
    case "ArrowUp": event.preventDefault(); prevChannel(); break;
    case "Enter": event.preventDefault(); playCurrent(); break;
  }
});

});

/* =========================================================
   INITIALIZATION
========================================================= */
async function init() {
  // Load channel list from channel.txt
  const channelsLoaded = await loadChannels();
  if (!channelsLoaded) return;

  // Populate dropdowns
  channels.forEach(code => {
    const option = document.createElement("option");
    option.value = code;
    option.textContent = code;
    channelSelect.appendChild(option);
  });

  templates.forEach((template, index) => {
    const option = document.createElement("option");
    option.value = index;
    option.textContent = template.name;
    templateSelect.appendChild(option);
  });

  // Set defaults
  channelSelect.value = "angiang";
  templateSelect.value = "0";

  // Bind iOS buttons
  bindIOSButton(prevChannelBtn, prevChannel);
  bindIOSButton(nextChannelBtn, nextChannel);
  bindIOSButton(autoScanBtn, autoScanLinks);
  bindIOSButton(resetAutoScanBtn, resetAutoScanIndex);
  bindIOSButton(autoAllScanBtn, autoScanAllChannels);
  bindIOSButton(stopAutoAllBtn, stopAutoChannelScan);

  // Set initial state
  document.getElementById("channelToggle")?.setAttribute("aria-expanded", "true");
  document.getElementById("vidScanToggle")?.setAttribute("aria-expanded", "true");

  updateUrl();
  updateResultTable();
  updateVidResultList();

  console.log("✅ M3U8 Stream Discovery - Đã sẵn sàng");
  console.log("📱 iOS:", isIOS());
  console.log("🎬 Native HLS:", isNativeHLSSupported());
  console.log("📦 HLS.js:", isHlsSupported());
}

// Run initialization
if (document.readyState === "complete" || document.readyState === "interactive") {
  init();
} else {
  document.addEventListener("DOMContentLoaded", init);
}
</script>
