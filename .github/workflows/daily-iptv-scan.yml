name: Daily IPTV Scan

on:
  workflow_dispatch:
  schedule:
    # Daily at 03:00 Vietnam time (20:00 UTC on the previous day)
    - cron: "0 20 * * *"

permissions:
  contents: read

concurrency:
  group: daily-iptv-scan
  cancel-in-progress: false

jobs:
  scan-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scan channels, check links, and export M3U
        run: python main.py

      - name: Upload scan results and M3U
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-M3U-Results
          path: output/
          if-no-files-found: warn
          retention-days: 14
