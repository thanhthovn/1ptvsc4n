name: M3U8 Link Finder

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL trang web chứa video"
        required: true
        type: string

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp

      - name: Validate and extract media URLs
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlparse

          url = os.environ["TARGET_URL"].strip()
          parsed = urlparse(url)
          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              sys.exit("URL không hợp lệ: chỉ chấp nhận HTTP/HTTPS.")

          # Refuse local and private destinations to reduce SSRF risk.
          host = parsed.hostname.lower()
          if host in {"localhost", "127.0.0.1", "::1", "0.0.0.0"}:
              sys.exit("Không chấp nhận địa chỉ loopback/local.")
          if re.match(r"^(10\.|192\.168\.|169\.254\.|172\.(1[6-9]|2\d|3[01])\.)", host):
              sys.exit("Không chấp nhận địa chỉ mạng riêng/link-local.")

          result = subprocess.run(
              [sys.executable, "-m", "yt_dlp", "--no-warnings",
               "--no-playlist", "--get-url", url],
              capture_output=True, text=True, timeout=180,
          )
          all_urls = [
              line.strip() for line in result.stdout.splitlines()
              if line.strip().startswith(("http://", "https://"))
          ]
          m3u8_urls = [
              item for item in all_urls
              if ".m3u8" in urlparse(item).path.lower()
          ]

          with open("m3u8-links.txt", "w", encoding="utf-8") as f:
              if m3u8_urls:
                  f.write("\n".join(dict.fromkeys(m3u8_urls)) + "\n")
              else:
                  f.write("Không tìm thấy URL M3U8.\n")
                  if all_urls:
                      f.write("\nCác URL media khác được phát hiện:\n")
                      f.write("\n".join(dict.fromkeys(all_urls)) + "\n")
                  if result.stderr:
                      f.write("\nThông báo yt-dlp:\n")
                      f.write(result.stderr[-5000:])

          print(f"Đã tìm thấy {len(m3u8_urls)} URL M3U8.")
          for item in dict.fromkeys(m3u8_urls):
              print(item)
          if result.returncode != 0:
              print("yt-dlp không trích xuất được hoàn toàn; xem file artifact để biết chi tiết.")
          PY

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: m3u8-links
          path: m3u8-links.txt
          if-no-files-found: error
          retention-days: 1
