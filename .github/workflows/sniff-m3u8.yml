name: M3U8 Link Finder

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL trang web chứa video"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: m3u8-link-finder
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Open page and capture M3U8 network requests
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import asyncio
          import ipaddress
          import os
          import socket
          import sys
          from urllib.parse import urlparse

          from playwright.async_api import async_playwright

          target = os.environ["TARGET_URL"].strip()
          parsed = urlparse(target)
          if parsed.scheme not in ("http", "https") or not parsed.hostname:
              sys.exit("URL không hợp lệ: chỉ chấp nhận HTTP/HTTPS.")

          host = parsed.hostname
          if host.lower() == "localhost":
              sys.exit("Không chấp nhận địa chỉ local.")
          try:
              addresses = {item[4][0] for item in socket.getaddrinfo(host, None)}
              if not addresses or any(not ipaddress.ip_address(addr).is_global for addr in addresses):
                  sys.exit("Từ chối hostname trỏ tới IP không công khai.")
          except socket.gaierror:
              sys.exit("Không phân giải được hostname.")

          found = set()
          tasks = set()

          def consider(url, content_type=""):
              if not url.startswith(("http://", "https://")):
                  return
              path = urlparse(url).path.lower()
              ctype = content_type.lower()
              if ".m3u8" in path or "mpegurl" in ctype:
                  found.add(url)

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context(
                      viewport={"width": 1365, "height": 900},
                      ignore_https_errors=True,
                  )
                  page = await context.new_page()
                  page.on("request", lambda req: consider(req.url))

                  def on_response(response):
                      async def inspect():
                          try:
                              headers = await response.all_headers()
                              consider(response.url, headers.get("content-type", ""))
                          except Exception:
                              pass
                      task = asyncio.create_task(inspect())
                      tasks.add(task)
                      task.add_done_callback(tasks.discard)

                  page.on("response", on_response)
                  try:
                      await page.goto(target, wait_until="domcontentloaded", timeout=45000)
                  except Exception as exc:
                      print(f"Trang không tải hoàn chỉnh: {type(exc).__name__}")

                  # Wait for JavaScript players to initialize and request manifests.
                  await page.wait_for_timeout(20000)
                  try:
                      await page.evaluate("""() => {
                        document.querySelectorAll('video').forEach(v => {
                          v.muted = true;
                          const p = v.play();
                          if (p && p.catch) p.catch(() => {});
                        });
                      }""")
                  except Exception:
                      pass
                  await page.wait_for_timeout(15000)
                  if tasks:
                      await asyncio.gather(*list(tasks), return_exceptions=True)
                  await browser.close()

          asyncio.run(main())

          output = "m3u8.txt"
          with open(output, "w", encoding="utf-8") as f:
              if found:
                  f.write("\n".join(sorted(found)) + "\n")
              else:
                  f.write("# Không bắt được URL M3U8 từ request/response của trang.\n")
                  f.write("# Thử URL trang phát video trực tiếp hoặc trang cần thao tác phát.\n")

          # Avoid printing signed URLs that may contain temporary access tokens.
          print(f"Đã bắt được {len(found)} URL M3U8; sẽ lưu kết quả vào m3u8.txt trong repo.")

      - name: Commit m3u8.txt to repository
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add m3u8.txt
          if git diff --cached --quiet; then
            echo "m3u8.txt không thay đổi, không cần commit."
          else
            git commit -m "Update detected M3U8 links"
            git push
          fi
